 * Compras gerais (não-supermercado): categoria, prioridade, valores estimado
 * e realizado, responsável, status e link de referência.
 * ===================================================================== */
var Shopping = (function () {
  var data = null;
  var ui = { filter: 'OPEN', q: '' };
  var STATUS = {
    PENDING: { label: 'Pendente', cls: 'b-gray', icon: 'clock' },
    APPROVED: { label: 'Aprovado', cls: 'b-blue', icon: 'thumbs-up' },
    BOUGHT: { label: 'Comprado', cls: 'b-green', icon: 'circle-check-big' },
    CANCELED: { label: 'Cancelado', cls: 'b-red', icon: 'circle-x' }
  };

  function load() { return App.api('general.list').then(function (d) { data = d; return d; }); }
  function ensure() { return data ? Promise.resolve(data) : load(); }

  /** Abas do topo de Compras: "Compras | Desejos" (no celular, Desejos vive dentro de Compras). */
  function switcher(el, active) {
    if (!moduloAtivo('desejos') || !App.can('wishes.view')) return;
    var seg = document.createElement('div');
    seg.className = 'segmented';
    seg.innerHTML = '<button data-sw="shopping" class="' + (active === 'shopping' ? 'on' : '') + '">' + UI.icon('shopping-bag', 'sm') + ' Compras</button>' +
      '<button data-sw="wishes" class="' + (active === 'wishes' ? 'on' : '') + '">' + UI.icon('heart', 'sm') + ' Desejos</button>';
    seg.querySelectorAll('[data-sw]').forEach(function (b) {
      b.onclick = function () { if (b.dataset.sw !== active) App.go(b.dataset.sw); };
    });
    el.appendChild(seg);
  }

  function render(root) {
    root.innerHTML = '';
    switcher(root, 'shopping');
    var el = document.createElement('div');
    root.appendChild(el);
    el.innerHTML = UI.skeleton([96, 44, 72, 72, 72]);
    load().then(function () { if (App.state.view === 'shopping') draw(el); }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      el.innerHTML = UI.empty('cloud-off', 'Não foi possível carregar', e.message, '<button class="btn btn-soft btn-sm" onclick="App.reload()">Tentar novamente</button>');
      UI.refreshIcons();
    });
  }

  function isOpen(i) { return i.status === 'PENDING' || i.status === 'APPROVED'; }

  function draw(el) {
    App.setHeader('Compras', 'Itens além do mercado');
    if (App.can('general.manage')) App.fab({ label: 'Novo item', icon: 'plus', onClick: function () { form(null, App.reload); } });
    var items = data.items;
    var open = items.filter(isOpen);
    var estimated = open.reduce(function (a, i) { return a + i.estimatedValue; }, 0);
    var spent = items.filter(function (i) { return i.status === 'BOUGHT'; }).reduce(function (a, i) { return a + (i.actualValue || 0); }, 0);

    if (!items.length) {
      el.innerHTML = '<div class="card">' + UI.empty('shopping-bag', 'Nenhuma compra planejada',
        App.can('general.manage') ? 'Registre itens para a casa — eletrônicos, manutenção, decoração — com prioridade, responsável e valor estimado.' : 'Quando um adulto da casa adicionar itens, eles aparecerão aqui.',
        App.can('general.manage') ? '<button class="btn btn-primary btn-sm" id="firstGen">' + UI.icon('plus') + ' Adicionar item</button>' : '') + '</div>';
      var fg = document.getElementById('firstGen');
      if (fg) fg.onclick = function () { form(null, App.reload); };
      UI.refreshIcons();
      return;
    }

    var chips = [
      { v: 'OPEN', l: 'Em aberto', n: open.length },
      { v: 'HIGH', l: 'Prioridade alta', n: open.filter(function (i) { return i.priority === 'HIGH'; }).length },
      { v: 'BOUGHT', l: 'Comprados', n: items.filter(function (i) { return i.status === 'BOUGHT'; }).length },
      { v: 'CANCELED', l: 'Cancelados', n: items.filter(function (i) { return i.status === 'CANCELED'; }).length },
      { v: 'ALL', l: 'Todos', n: items.length }
    ];
    el.innerHTML =
      '<div class="stats" style="margin-bottom:14px">' +
        '<div class="stat tone-blue"><span class="ic">' + UI.icon('shopping-bag') + '</span><span class="val num">' + open.length + '</span><span class="lbl">Pendentes</span><span class="hint">Estimado ' + UI.money(estimated) + '</span></div>' +
        '<div class="stat tone-green"><span class="ic">' + UI.icon('circle-check-big') + '</span><span class="val num" style="font-size:20px">' + UI.money(spent) + '</span><span class="lbl">Realizado</span><span class="hint">em itens comprados</span></div>' +
      '</div>' +
      '<div class="search">' + UI.icon('search') + '<input id="gq" placeholder="Buscar item" value="' + UI.esc(ui.q) + '"></div>' +
      '<div class="chips">' + chips.map(function (c) {
        return '<button class="chip' + (ui.filter === c.v ? ' on' : '') + '" data-f="' + c.v + '">' + c.l + ' <span class="n">' + c.n + '</span></button>';
      }).join('') + '</div><div id="gList"></div>';
    el.querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () { ui.filter = b.dataset.f; el.querySelectorAll('[data-f]').forEach(function (x) { x.classList.toggle('on', x === b); }); paint(); };
    });
    document.getElementById('gq').oninput = function (e) { ui.q = e.target.value; paint(); };
    paint();
  }

  function paint() {
    var box = document.getElementById('gList');
    if (!box) return;
    var q = ui.q.trim().toLowerCase();
    var list = data.items.filter(function (i) {
      var ok = ui.filter === 'ALL' ? true : ui.filter === 'OPEN' ? isOpen(i) : ui.filter === 'HIGH' ? (isOpen(i) && i.priority === 'HIGH') : i.status === ui.filter;
      return ok && (!q || (i.name + ' ' + i.category).toLowerCase().indexOf(q) !== -1);
    });
    box.innerHTML = list.length ? '<div class="list">' + list.map(function (i) {
      var st = STATUS[i.status];
      var value = i.status === 'BOUGHT' && i.actualValue ? i.actualValue : i.estimatedValue;
      return '<button class="row" data-gid="' + i.itemId + '"><span class="lead-ic">' + UI.icon(st.icon) + '</span>' +
        '<span class="main"><span class="t">' + UI.esc(i.name) + '</span>' +
        '<span class="s">' + (i.category ? UI.esc(i.category) + ' · ' : '') + (i.responsibleName ? UI.esc(i.responsibleName) : 'Sem responsável') + '</span>' +
        '<span class="tag-line">' + UI.priorityBadge(i.priority) + '<span class="badge ' + st.cls + '">' + st.label + '</span>' + (i.link ? '<span class="badge b-gray">' + UI.icon('link', 'sm') + '</span>' : '') + '</span></span>' +
        '<span class="end">' + (value ? '<span class="num" style="font-weight:700">' + UI.money(value) + '</span><br><small class="muted">' + (i.status === 'BOUGHT' && i.actualValue ? 'realizado' : 'estimado') + '</small>' : '') + '</span></button>';
    }).join('') + '</div>' : '<div class="card">' + UI.empty('search-x', 'Nenhum item', 'Nada encontrado com este filtro.') + '</div>';
    box.querySelectorAll('[data-gid]').forEach(function (b) {
      b.onclick = function () { detail(data.items.filter(function (i) { return i.itemId === b.dataset.gid; })[0]); };
    });
    UI.refreshIcons();
  }

  function detail(i) {
    var st = STATUS[i.status];
    var manage = App.can('general.manage');
    UI.sheet({
      title: i.name,
      body: '<div class="tag-line" style="margin:0 0 14px">' + UI.priorityBadge(i.priority) + '<span class="badge ' + st.cls + '">' + st.label + '</span></div>' +
        '<div class="card" style="padding:4px 16px;box-shadow:none">' +
          '<div class="kv"><span>Categoria</span><strong>' + UI.esc(i.category || '—') + '</strong></div>' +
          '<div class="kv"><span>Responsável</span><strong>' + UI.esc(i.responsibleName || '—') + '</strong></div>' +
          '<div class="kv"><span>Valor estimado</span><strong class="num">' + (i.estimatedValue ? UI.money(i.estimatedValue) : '—') + '</strong></div>' +
          '<div class="kv"><span>Valor realizado</span><strong class="num">' + (i.actualValue ? UI.money(i.actualValue) : '—') + '</strong></div>' +
          (i.notes ? '<div class="kv"><span>Observações</span><strong>' + UI.esc(i.notes) + '</strong></div>' : '') +
          '<div class="kv"><span>Criado por</span><strong>' + UI.esc(i.createdBy || '—') + ' · ' + UI.dateShort(i.createdAt) + '</strong></div>' +
        '</div>' +
        (i.link ? '<a class="btn btn-ghost btn-block mt" href="' + UI.esc(i.link) + '" target="_blank" rel="noopener noreferrer">' + UI.icon('external-link') + ' Abrir link de referência</a>' : '') +
        (manage && isOpen(i) ? '<div class="btn-row mt">' +
          (i.status === 'PENDING' ? '<button class="btn btn-soft" data-st="APPROVED">' + UI.icon('thumbs-up') + ' Aprovar</button>' : '') +
          '<button class="btn btn-primary" data-st="BOUGHT">' + UI.icon('check') + ' Comprado</button></div>' : '') +
        (manage && !isOpen(i) ? '<button class="btn btn-soft btn-block mt" data-st="PENDING">' + UI.icon('rotate-ccw') + ' Voltar para pendente</button>' : ''),
      foot: manage ? '<button class="btn btn-danger" id="gDel" style="flex:0 0 auto">' + UI.icon('trash-2') + '</button>' +
        (isOpen(i) ? '<button class="btn btn-ghost" data-st="CANCELED">Cancelar item</button>' : '') +
        '<button class="btn btn-ghost" id="gEdit">' + UI.icon('pencil') + ' Editar</button>' : null,
      onMount: function (el, close) {
        el.querySelectorAll('[data-st]').forEach(function (b) {
          b.onclick = function () {
            var status = b.dataset.st;
            if (status === 'BOUGHT') { close(); return boughtForm(i); }
            UI.run(b, function () { return App.api('general.status', { itemId: i.itemId, status: status }); }, 'Status atualizado: ' + STATUS[status].label)
              .then(function () { close(); data = null; refresh(); }, function () {});
          };
        });
        var ed = el.querySelector('#gEdit');
        if (ed) ed.onclick = function () { close(); form(i, refresh); };
        var del = el.querySelector('#gDel');
        if (del) del.onclick = function () {
          UI.confirm({ title: 'Excluir item?', message: '"' + i.name + '" será removido definitivamente.', ok: 'Excluir', danger: true, icon: 'trash-2' }).then(function (ok) {
            if (!ok) return;
            App.api('general.delete', { itemId: i.itemId }).then(function () { UI.toast('Item excluído'); close(); data = null; refresh(); }, function (e) { UI.toast(e.message, 'error'); });
          });
        };
      }
    });
  }

  function refresh() { if (App.state.view === 'shopping' || App.state.view === 'home') App.reload(); }

  function boughtForm(i) {
    UI.sheet({
      title: 'Marcar como comprado',
      body: '<div style="font-weight:700;margin-bottom:12px">' + UI.esc(i.name) + '</div><form id="bf">' +
        UI.field('Valor pago', UI.moneyInput('actualValue', i.actualValue || i.estimatedValue || ''), 'Usado para comparar com o valor estimado.') + '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="bfOk">Confirmar</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#bf');
        function ok() {
          var v = UI.parseMoney(f.actualValue.value);
          if (isNaN(v)) return UI.toast('Valor inválido.', 'error');
          UI.run(el.querySelector('#bfOk'), function () { return App.api('general.status', { itemId: i.itemId, status: 'BOUGHT', actualValue: v }); }, 'Item marcado como comprado')
            .then(function () { close(); data = null; refresh(); }, function () {});
        }
        el.querySelector('#bfOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
      }
    });
  }

  /** Formulário de item (novo ou edição). */
  function form(item, onDone) {
    var changed = false;
    var isNew = !item;
    item = item || { priority: 'MEDIUM', status: 'PENDING' };
    ensure().then(function (d) {
      UI.sheet({
        title: isNew ? 'Nova compra geral' : 'Editar item',
        body: '<form id="gForm">' +
          UI.field('Item', UI.input('name', item.name, 'maxlength="80" placeholder="ex.: Aspirador de pó"')) +
          UI.field('Prioridade', UI.options('priority', [
            { value: 'LOW', label: 'Baixa', icon: 'arrow-down' }, { value: 'MEDIUM', label: 'Média', icon: 'minus' }, { value: 'HIGH', label: 'Alta', icon: 'arrow-up' }
          ], item.priority)) +
          '<div class="grid2">' + UI.field('Categoria', UI.input('category', item.category, 'list="genCats" maxlength="40" placeholder="Escolha ou digite"') +
            '<datalist id="genCats">' + d.categories.map(function (c) { return '<option value="' + UI.esc(c) + '">'; }).join('') + '</datalist>') +
          UI.field('Responsável', UI.select('responsibleId', [{ value: '', label: 'Ninguém' }].concat(d.members.map(function (m) { return { value: m.memberId, label: m.name }; })), item.responsibleId)) + '</div>' +
          '<div class="grid2">' + UI.field('Valor estimado', UI.moneyInput('estimatedValue', item.estimatedValue)) +
          UI.field('Valor realizado', UI.moneyInput('actualValue', item.actualValue)) + '</div>' +
          UI.field('Status', UI.select('status', Object.keys(STATUS).map(function (k) { return { value: k, label: STATUS[k].label }; }), item.status)) +
          UI.field('Link de referência', UI.input('link', item.link, 'type="url" inputmode="url" placeholder="https://"')) +
          UI.field('Observações', '<textarea class="input" name="notes" maxlength="300" placeholder="Modelo, cor, loja…">' + UI.esc(item.notes || '') + '</textarea>') +
          '</form>',
        full: true,
        foot: '<button class="btn btn-ghost" data-close>Cancelar</button>' +
          (isNew ? '<button class="btn btn-ghost" id="gSaveAgain">Salvar e adicionar outro</button>' : '') +
          '<button class="btn btn-primary btn-full" id="gSave">Salvar</button>',
        onClose: function () { if (changed && onDone) onDone(); },
        onMount: function (el, close) {
          var f = el.querySelector('#gForm');
          UI.bindOptions(f);
          function save(again) {
            var v = UI.formData(f);
            if (!v.name.trim()) return UI.toast('Informe o item.', 'error');
            v.estimatedValue = UI.parseMoney(v.estimatedValue);
            v.actualValue = UI.parseMoney(v.actualValue);
            if (isNaN(v.estimatedValue) || isNaN(v.actualValue)) return UI.toast('Valor inválido.', 'error');
            if (!isNew) v.itemId = item.itemId;
            UI.run(el.querySelector(again ? '#gSaveAgain' : '#gSave'), function () { return App.api(isNew ? 'general.create' : 'general.update', v); }, isNew ? 'Item adicionado' : 'Item atualizado')
              .then(function () {
                changed = true; data = null;
                if (!again) return close();
                ['name', 'estimatedValue', 'actualValue', 'link', 'notes'].forEach(function (k) { if (f[k]) f[k].value = ''; });
                f.name.focus();
              }, function () {});
          }
          el.querySelector('#gSave').onclick = function () { save(false); };
          var ag = el.querySelector('#gSaveAgain');
          if (ag) ag.onclick = function () { save(true); };
          f.onsubmit = function (e) { e.preventDefault(); save(false); };
        }
      });
    }, function (e) { UI.toast(e.message, 'error'); });
  }

  App.register('shopping', { title: 'Compras', render: render, perm: 'general.view' });
  return { form: form, switcher: switcher };
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Lista de desejos
 * Coisas que alguém da casa tem vontade de comprar, com link e preço,
 * compartilhadas com todos. Desejo → Compras (quando vira plano) → realizado.
 * ===================================================================== */
var Wishes = (function () {
  var data = null;
  var ui = { filter: 'OPEN', q: '' };
  var DESIRE = {
    HIGH: { label: 'Muita vontade', short: 'Muita', cls: 'b-red', icon: 'flame' },
    MEDIUM: { label: 'Vontade média', short: 'Média', cls: 'b-yellow', icon: 'heart' },
    LOW: { label: 'Pouca vontade', short: 'Pouca', cls: 'b-gray', icon: 'feather' }
  };
  var STATUS = {
    WANTED: { label: 'Desejado', cls: 'b-green' },
    PLANNED: { label: 'Em Compras', cls: 'b-blue' },
    BOUGHT: { label: 'Realizado', cls: 'b-green' },
    DROPPED: { label: 'Desistimos', cls: 'b-gray' }
  };

  function load() { return App.api('wishes.list').then(function (d) { data = d; return d; }); }
  function ensure() { return data ? Promise.resolve(data) : load(); }
  function mine(w) { var me = App.me().memberId; return w.ownerId === me; }
  function canEdit(w) { var me = App.me().memberId; return App.can('wishes.manage') || w.ownerId === me || w.createdById === me; }

  function render(el) {
    el.innerHTML = '';
    Shopping.switcher(el, 'wishes');
    var box = document.createElement('div');
    box.innerHTML = UI.skeleton([96, 44, 72, 72]);
    el.appendChild(box);
    App.setHeader('Desejos', 'Lista da casa');
    App.fab({ label: 'Desejo', icon: 'heart', onClick: function () { form(null, App.reload); } });
    load().then(function () { if (App.state.view === 'wishes') draw(box); }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      box.innerHTML = UI.empty('cloud-off', 'Não foi possível carregar', e.message, '<button class="btn btn-soft btn-sm" onclick="App.reload()">Tentar novamente</button>');
    });
  }

  function draw(box) {
    var all = data.wishes;
    var open = all.filter(function (w) { return w.status === 'WANTED'; });
    if (!all.length) {
      box.innerHTML = '<div class="card">' + UI.empty('heart', 'Nenhum desejo ainda',
        'Guarde aqui o que você tem vontade de comprar, com o link do produto. Todos da casa veem — ótimo para presentes e para planejar.',
        '<button class="btn btn-primary btn-sm" id="firstWish">' + UI.icon('heart') + ' Adicionar desejo</button>') + '</div>';
      box.querySelector('#firstWish').onclick = function () { form(null, App.reload); };
      return;
    }
    var total = open.reduce(function (a, w) { return a + (w.price || 0); }, 0);
    var chips = [
      { v: 'OPEN', l: 'Desejados', n: open.length },
      { v: 'MINE', l: 'Meus', n: open.filter(mine).length },
      { v: 'HIGH', l: 'Muita vontade', n: open.filter(function (w) { return w.desire === 'HIGH'; }).length },
      { v: 'DONE', l: 'Realizados e outros', n: all.length - open.length }
    ];
    box.innerHTML =
      '<div class="card" style="display:flex;align-items:center;gap:14px;margin-bottom:14px">' +
        '<span class="lead-ic" style="width:46px;height:46px;border-radius:14px;background:var(--red-soft);color:var(--red);display:grid;place-items:center">' + UI.icon('heart') + '</span>' +
        '<div style="flex:1"><div class="muted" style="font-size:13px">' + open.length + ' desejo(s) da casa</div>' +
        '<div class="num valor" style="font-size:22px;font-weight:800">' + UI.money(total) + '</div></div>' +
        '<span class="muted" style="font-size:12px;text-align:right">soma dos<br>preços</span></div>' +
      '<div class="search">' + UI.icon('search') + '<input id="wq" placeholder="Buscar desejo" value="' + UI.esc(ui.q) + '"></div>' +
      '<div class="chips">' + chips.map(function (c) {
        return '<button class="chip' + (ui.filter === c.v ? ' on' : '') + '" data-f="' + c.v + '">' + c.l + ' <span class="n">' + c.n + '</span></button>';
      }).join('') + '</div><div id="wList"></div>';
    box.querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () { ui.filter = b.dataset.f; box.querySelectorAll('[data-f]').forEach(function (x) { x.classList.toggle('on', x === b); }); paint(); };
    });
    box.querySelector('#wq').oninput = function (e) { ui.q = e.target.value; paint(); };
    paint();
  }

  function paint() {
    var box = document.getElementById('wList');
    if (!box) return;
    var q = ui.q.trim().toLowerCase();
    var list = data.wishes.filter(function (w) {
      var ok = ui.filter === 'OPEN' ? w.status === 'WANTED' : ui.filter === 'MINE' ? (w.status === 'WANTED' && mine(w)) :
        ui.filter === 'HIGH' ? (w.status === 'WANTED' && w.desire === 'HIGH') : w.status !== 'WANTED';
      return ok && (!q || (w.name + ' ' + w.category + ' ' + w.ownerName).toLowerCase().indexOf(q) !== -1);
    });
    box.innerHTML = list.length ? '<div class="list">' + list.map(function (w) {
      var d = DESIRE[w.desire] || DESIRE.MEDIUM;
      return '<div class="row" data-wid="' + w.wishId + '">' +
        (w.ownerName ? UI.avatar(w.ownerName, w.ownerColor) : '<span class="lead-ic">' + UI.icon('heart') + '</span>') +
        '<button class="main" data-open style="text-align:left"><div class="t">' + UI.esc(w.name) + '</div>' +
        '<div class="s">' + UI.esc(w.ownerName || '—') + (w.category ? ' · ' + UI.esc(w.category) : '') + '</div>' +
        '<div class="tag-line"><span class="badge ' + d.cls + '">' + UI.icon(d.icon, 'sm') + d.short + '</span>' +
        (w.status !== 'WANTED' ? '<span class="badge ' + STATUS[w.status].cls + '">' + STATUS[w.status].label + '</span>' : '') + '</div></button>' +
        '<div class="end" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">' +
          (w.price ? '<span class="num valor" style="font-weight:700">' + UI.money(w.price) + '</span>' : '') +
          (w.link ? '<a class="btn btn-soft btn-sm" href="' + UI.esc(w.link) + '" target="_blank" rel="noopener noreferrer" aria-label="Abrir link">' + UI.icon('external-link', 'sm') + '</a>' : '') +
        '</div></div>';
    }).join('') + '</div>' : '<div class="card">' + UI.empty('search-x', 'Nada por aqui', 'Nenhum desejo neste filtro.') + '</div>';
    box.querySelectorAll('[data-wid]').forEach(function (row) {
      row.querySelector('[data-open]').onclick = function () { detail(data.wishes.filter(function (w) { return w.wishId === row.dataset.wid; })[0]); };
    });
  }

  function share(w) {
    var txt = 'Desejo da casa: ' + w.name + (w.price ? ' (' + UI.money(w.price) + ')' : '') + (w.ownerName ? ' — de ' + w.ownerName : '') + (w.link ? '\n' + w.link : '');
    if (navigator.share) return navigator.share({ title: w.name, text: txt }).catch(function () {});
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(function () { UI.toast('Copiado para compartilhar'); });
    UI.toast('Compartilhamento indisponível neste navegador.', 'error');
  }

  function act(action, payload, msg, close) {
    return App.api(action, payload).then(function (r) { UI.toast(msg); if (close) close(); data = null; App.reload(); return r; }, function (e) { UI.toast(e.message, 'error'); });
  }

  function detail(w) {
    var d = DESIRE[w.desire] || DESIRE.MEDIUM;
    var edit = canEdit(w), wanted = w.status === 'WANTED';
    UI.sheet({
      title: w.name,
      body: '<div class="tag-line" style="margin:0 0 14px"><span class="badge ' + d.cls + '">' + UI.icon(d.icon, 'sm') + d.label + '</span>' +
          '<span class="badge ' + STATUS[w.status].cls + '">' + STATUS[w.status].label + '</span></div>' +
        (w.price ? '<div class="num valor" style="font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px">' + UI.money(w.price) + '</div>' : '') +
        '<div class="btn-row" style="margin-bottom:14px">' +
          (w.link ? '<a class="btn btn-primary" href="' + UI.esc(w.link) + '" target="_blank" rel="noopener noreferrer">' + UI.icon('external-link') + ' Abrir link</a>' : '') +
          '<button class="btn btn-ghost" id="wShare">' + UI.icon('share-2') + ' Compartilhar</button></div>' +
        '<div class="card" style="padding:4px 16px;box-shadow:none">' +
          '<div class="kv"><span>Quem deseja</span><strong>' + UI.esc(w.ownerName || '—') + '</strong></div>' +
          '<div class="kv"><span>Categoria</span><strong>' + UI.esc(w.category || '—') + '</strong></div>' +
          (w.notes ? '<div class="kv"><span>Observações</span><strong>' + UI.esc(w.notes) + '</strong></div>' : '') +
          '<div class="kv"><span>Adicionado por</span><strong>' + UI.esc(w.createdBy || '—') + ' · ' + UI.dateShort(w.createdAt) + '</strong></div>' +
        '</div>' +
        (wanted && edit ? '<div class="btn-row mt">' +
          (App.can('general.manage') ? '<button class="btn btn-soft" id="wPlan">' + UI.icon('shopping-bag') + ' Para Compras</button>' : '') +
          '<button class="btn btn-soft" id="wBought">' + UI.icon('check') + ' Realizado</button></div>' : '') +
        (!wanted && edit && w.status !== 'PLANNED' ? '<button class="btn btn-soft btn-block mt" id="wReopen">' + UI.icon('rotate-ccw') + ' Voltar para desejados</button>' : '') +
        (w.status === 'PLANNED' ? '<div class="notice info mt">' + UI.icon('shopping-bag', 'sm') + '<span>Este desejo virou um item em Compras, onde o andamento é acompanhado.</span></div>' : ''),
      foot: edit ? '<button class="btn btn-danger" id="wDel" style="flex:0 0 auto">' + UI.icon('trash-2') + '</button>' +
        (wanted ? '<button class="btn btn-ghost" id="wDrop">Desistir</button>' : '') +
        '<button class="btn btn-ghost" id="wEdit">' + UI.icon('pencil') + ' Editar</button>' : null,
      onMount: function (el, close) {
        var on = function (id, fn) { var b = el.querySelector('#' + id); if (b) b.onclick = fn; };
        on('wShare', function () { share(w); });
        on('wPlan', function () { UI.run(el.querySelector('#wPlan'), function () { return act('wishes.toShopping', { wishId: w.wishId }, 'Enviado para Compras', close); }); });
        on('wBought', function () { act('wishes.status', { wishId: w.wishId, status: 'BOUGHT' }, 'Desejo realizado!', close); });
        on('wReopen', function () { act('wishes.status', { wishId: w.wishId, status: 'WANTED' }, 'Voltou para os desejos', close); });
        on('wDrop', function () { act('wishes.status', { wishId: w.wishId, status: 'DROPPED' }, 'Desejo arquivado', close); });
        on('wEdit', function () { close(); form(w, App.reload); });
        on('wDel', function () {
          UI.confirm({ title: 'Excluir desejo?', message: '"' + w.name + '" será removido.', ok: 'Excluir', danger: true, icon: 'trash-2' }).then(function (ok) {
            if (ok) act('wishes.delete', { wishId: w.wishId }, 'Desejo excluído', close);
          });
        });
      }
    });
  }

  function form(w, onDone) {
    var isNew = !w, changed = false;
    w = w || { desire: 'MEDIUM', ownerId: App.me().memberId };
    ensure().then(function (d) {
      UI.sheet({
        title: isNew ? 'Novo desejo' : 'Editar desejo',
        full: true,
        body: '<form id="wForm">' +
          UI.field('O que você deseja?', UI.input('name', w.name, 'maxlength="80" placeholder="ex.: Fone bluetooth"')) +
          UI.field('Link do produto', UI.input('link', w.link, 'type="url" inputmode="url" placeholder="https:// (cole o link da loja)"'), 'Quem for comprar abre exatamente este produto.') +
          '<div class="grid2">' + UI.field('Preço aproximado', UI.moneyInput('price', w.price)) +
          UI.field('Quem deseja', UI.select('ownerId', d.members.map(function (m) { return { value: m.memberId, label: m.name }; }), w.ownerId)) + '</div>' +
          UI.field('Vontade', UI.options('desire', [
            { value: 'LOW', label: 'Pouca', icon: 'feather' }, { value: 'MEDIUM', label: 'Média', icon: 'heart' }, { value: 'HIGH', label: 'Muita', icon: 'flame' }
          ], w.desire)) +
          UI.field('Categoria', UI.input('category', w.category, 'list="wishCats" maxlength="40" placeholder="Escolha ou digite"') +
            '<datalist id="wishCats">' + d.categories.map(function (c) { return '<option value="' + UI.esc(c) + '">'; }).join('') + '</datalist>') +
          UI.field('Observações', '<textarea class="input" name="notes" maxlength="300" placeholder="Cor, tamanho, modelo…">' + UI.esc(w.notes || '') + '</textarea>') +
          '</form>',
        foot: '<button class="btn btn-ghost" data-close>Cancelar</button>' +
          (isNew ? '<button class="btn btn-ghost" id="wfAgain">Salvar e adicionar outro</button>' : '') +
          '<button class="btn btn-primary btn-full" id="wfSave">Salvar desejo</button>',
        onClose: function () { if (changed && onDone) onDone(); },
        onMount: function (el, close) {
          var f = el.querySelector('#wForm');
          UI.bindOptions(f);
          function save(again) {
            var v = UI.formData(f);
            if (!v.name.trim()) return UI.toast('Diga o que você deseja.', 'error');
            v.price = UI.parseMoney(v.price);
            if (isNaN(v.price)) return UI.toast('Preço inválido.', 'error');
            if (v.link && !/^https?:\/\//i.test(v.link.trim())) v.link = 'https://' + v.link.trim();
            if (!isNew) v.wishId = w.wishId;
            UI.run(el.querySelector(again ? '#wfAgain' : '#wfSave'), function () { return App.api(isNew ? 'wishes.create' : 'wishes.update', v); }, isNew ? 'Desejo adicionado' : 'Desejo atualizado')
              .then(function () {
                changed = true; data = null;
                if (!again) return close();
                ['name', 'link', 'price', 'notes'].forEach(function (k) { f[k].value = ''; });
                f.name.focus();
              }, function () {});
          }
          el.querySelector('#wfSave').onclick = function () { save(false); };
          var ag = el.querySelector('#wfAgain');
          if (ag) ag.onclick = function () { save(true); };
          f.onsubmit = function (e) { e.preventDefault(); save(false); };
        }
      });
    }, function (e) { UI.toast(e.message, 'error'); });
  }

  App.register('wishes', { title: 'Desejos', tab: 'shopping', top: true, modulo: 'desejos', perm: 'wishes.view', render: render });
  return { form: form };
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Home.html  (aba CASA)
 * Afazeres domésticos: cadastro, responsável, prazo, prioridade, status,
 * visualização em lista e Kanban.
 * ===================================================================== */
var House = (function () {
  var data = null;
  var ui = { mode: Store.get('taskMode', 'list'), filter: 'OPEN' };
  var STATUS = {
    TODO: { label: 'A fazer', icon: 'circle', cls: 'b-gray' },
    DOING: { label: 'Fazendo', icon: 'loader', cls: 'b-blue' },
    DONE: { label: 'Concluída', icon: 'circle-check-big', cls: 'b-green' }
  };

  function load() { return App.api('tasks.list').then(function (d) { data = d; return d; }); }
  function ensure() { return data ? Promise.resolve(data) : load(); }

  function canMove(t) {
    return App.can('tasks.manage') || (App.can('tasks.updateAssigned') && t.responsibleId === App.me().memberId);
  }
  function overdue(t) { return t.status !== 'DONE' && t.dueDate && t.dueDate < data.today; }

  function dueLabel(t) {
    if (!t.dueDate) return '';
    if (t.dueDate === data.today) return 'Hoje';
    return (overdue(t) ? 'Atrasada · ' : '') + UI.dateShort(t.dueDate);
  }

  function render(el, params) {
    if (params && params.filter) { ui.filter = params.filter; params.filter = null; }
    el.innerHTML = UI.skeleton([44, 44, 72, 72, 72]);
    load().then(function () { if (App.state.view === 'house') draw(el); }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      el.innerHTML = UI.empty('cloud-off', 'Não foi possível carregar', e.message, '<button class="btn btn-soft btn-sm" onclick="App.reload()">Tentar novamente</button>');
      UI.refreshIcons();
    });
  }

  function draw(el) {
    var tasks = data.tasks;
    var open = tasks.filter(function (t) { return t.status !== 'DONE'; });
    App.setHeader('Casa', open.length ? open.length + ' afazer(es) em aberto' : 'Afazeres domésticos');
    if (App.can('tasks.manage')) App.fab({ label: 'Tarefa', icon: 'plus', onClick: function () { form(null, App.reload); } });

    if (!tasks.length) {
      el.innerHTML = '<div class="card">' + UI.empty('sparkles', 'Nenhum afazer cadastrado',
        App.can('tasks.manage') ? 'Organize as tarefas da casa, defina responsáveis e prazos e acompanhe pelo Kanban.' : 'Quando um adulto criar tarefas, elas aparecerão aqui.',
        App.can('tasks.manage') ? '<button class="btn btn-primary btn-sm" id="firstTask">' + UI.icon('plus') + ' Criar tarefa</button>' : '') + '</div>';
      var ft = document.getElementById('firstTask');
      if (ft) ft.onclick = function () { form(null, App.reload); };
      UI.refreshIcons();
      return;
    }

    el.innerHTML = '<div class="segmented"><button data-mode="list" class="' + (ui.mode === 'list' ? 'on' : '') + '">' + UI.icon('list', 'sm') + ' Lista</button>' +
      '<button data-mode="kanban" class="' + (ui.mode === 'kanban' ? 'on' : '') + '">' + UI.icon('columns-3', 'sm') + ' Kanban</button></div><div id="tBody"></div>';
    el.querySelectorAll('[data-mode]').forEach(function (b) {
      b.onclick = function () { ui.mode = b.dataset.mode; Store.set('taskMode', ui.mode); draw(el); };
    });
    var body = document.getElementById('tBody');
    if (ui.mode === 'kanban') drawKanban(body); else drawList(body);
    UI.refreshIcons();
  }

  function drawList(body) {
    var me = App.me().memberId;
    var tasks = data.tasks;
    var chips = [
      { v: 'OPEN', l: 'Em aberto', n: tasks.filter(function (t) { return t.status !== 'DONE'; }).length },
      { v: 'MINE', l: 'Minhas', n: tasks.filter(function (t) { return t.status !== 'DONE' && t.responsibleId === me; }).length },
      { v: 'LATE', l: 'Atrasadas', n: tasks.filter(overdue).length },
      { v: 'DONE', l: 'Concluídas', n: tasks.filter(function (t) { return t.status === 'DONE'; }).length }
    ];
    var list = tasks.filter(function (t) {
      if (ui.filter === 'MINE') return t.status !== 'DONE' && t.responsibleId === me;
      if (ui.filter === 'LATE') return overdue(t);
      if (ui.filter === 'DONE') return t.status === 'DONE';
      return t.status !== 'DONE';
    });
    body.innerHTML = '<div class="chips">' + chips.map(function (c) {
      return '<button class="chip' + (ui.filter === c.v ? ' on' : '') + '" data-f="' + c.v + '">' + c.l + ' <span class="n">' + c.n + '</span></button>';
    }).join('') + '</div>' +
      (list.length ? '<div class="list">' + list.map(function (t) {
        var mv = canMove(t);
        return '<div class="row' + (t.status === 'DONE' ? ' done' : '') + '" data-tid="' + t.taskId + '">' +
          '<button class="check' + (t.status === 'DONE' ? ' on' : '') + '" data-tg ' + (mv ? '' : 'disabled style="opacity:.5"') + ' aria-label="Concluir">' + UI.icon('check') + '</button>' +
          '<button class="main" data-open style="text-align:left"><div class="t">' + UI.esc(t.title) + '</div>' +
          '<div class="s">' + (t.responsibleName ? UI.esc(t.responsibleName) : 'Sem responsável') +
          (t.dueDate ? ' · <span style="' + (overdue(t) ? 'color:var(--red);font-weight:600' : '') + '">' + dueLabel(t) + '</span>' : '') +
          (t.status === 'DOING' ? ' · <span class="badge b-blue" style="padding:1px 6px">Fazendo</span>' : '') + '</div></button>' +
          UI.priorityBadge(t.priority) + '</div>';
      }).join('') + '</div>' : '<div class="card">' + UI.empty(ui.filter === 'LATE' ? 'party-popper' : 'list-checks',
        ui.filter === 'LATE' ? 'Nada atrasado' : ui.filter === 'DONE' ? 'Nenhuma tarefa concluída' : 'Tudo em dia', ui.filter === 'MINE' ? 'Nenhuma tarefa atribuída a você.' : '') + '</div>');
    body.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { ui.filter = b.dataset.f; drawList(body); }; });
    body.querySelectorAll('[data-tid]').forEach(function (row) {
      var t = find(row.dataset.tid);
      row.querySelector('[data-open]').onclick = function () { detail(t); };
      var tg = row.querySelector('[data-tg]');
      if (canMove(t)) tg.onclick = function () { setStatus(t, t.status === 'DONE' ? 'TODO' : 'DONE'); };
    });
    UI.refreshIcons();
  }

  function drawKanban(body) {
    body.innerHTML = '<div class="kanban">' + Object.keys(STATUS).map(function (s) {
      var col = data.tasks.filter(function (t) { return t.status === s; });
      if (s === 'DONE') col = col.slice(0, 20);
      return '<div class="kcol"><div class="kcol-head">' + UI.icon(STATUS[s].icon, 'sm') + STATUS[s].label + '<span class="n">' + col.length + '</span></div>' +
        (col.length ? col.map(function (t) {
          return '<button class="kcard" data-tid="' + t.taskId + '"><div class="t">' + UI.esc(t.title) + '</div><div class="meta">' + UI.priorityBadge(t.priority) +
            (t.dueDate ? '<span class="badge ' + (overdue(t) ? 'b-red' : 'b-gray') + '">' + UI.icon('calendar', 'sm') + ' ' + dueLabel(t) + '</span>' : '') +
            (t.responsibleName ? '<span style="margin-left:auto">' + UI.avatar(t.responsibleName, t.responsibleColor, 'xs') + '</span>' : '') + '</div></button>';
        }).join('') : '<div class="muted center" style="font-size:13px;padding:24px 0">Vazio</div>') + '</div>';
    }).join('') + '</div>';
    body.querySelectorAll('[data-tid]').forEach(function (b) { b.onclick = function () { detail(find(b.dataset.tid)); }; });
    UI.refreshIcons();
  }

  function find(id) { return data.tasks.filter(function (t) { return t.taskId === id; })[0]; }

  function setStatus(t, status, btn) {
    var p = App.api('tasks.status', { taskId: t.taskId, status: status });
    (btn ? UI.run(btn, function () { return p; }) : p).then(function () {
      UI.toast(status === 'DONE' ? 'Tarefa concluída' : 'Tarefa movida para "' + STATUS[status].label + '"');
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch (x) {} }
      data = null;
      if (App.state.view === 'house' || App.state.view === 'home') App.reload();
    }, function (e) { if (!btn) UI.toast(e.message, 'error'); });
  }

  function detail(t) {
    var mv = canMove(t), manage = App.can('tasks.manage');
    UI.sheet({
      title: t.title,
      body: '<div class="tag-line" style="margin:0 0 14px">' + UI.priorityBadge(t.priority) + '<span class="badge ' + STATUS[t.status].cls + '">' + STATUS[t.status].label + '</span>' +
          (overdue(t) ? '<span class="badge b-red">Atrasada</span>' : '') + '</div>' +
        (t.description ? '<p style="margin:0 0 14px;white-space:pre-wrap">' + UI.esc(t.description) + '</p>' : '') +
        '<div class="card" style="padding:4px 16px;box-shadow:none">' +
          '<div class="kv"><span>Responsável</span><strong>' + UI.esc(t.responsibleName || '—') + '</strong></div>' +
          '<div class="kv"><span>Prazo</span><strong>' + (t.dueDate ? UI.dateShort(t.dueDate) + '/' + t.dueDate.slice(0, 4) : '—') + '</strong></div>' +
          '<div class="kv"><span>Criada por</span><strong>' + UI.esc(t.createdBy || '—') + ' · ' + UI.dateShort(t.createdAt) + '</strong></div>' +
          (t.completedAt ? '<div class="kv"><span>Concluída em</span><strong>' + UI.dateShort(t.completedAt) + '</strong></div>' : '') +
        '</div>' +
        (mv ? '<div class="field mt"><label>Mover para</label><div class="opt-grid">' + Object.keys(STATUS).map(function (s) {
          return '<button type="button" class="opt' + (t.status === s ? ' on' : '') + '" data-st="' + s + '">' + UI.icon(STATUS[s].icon) + STATUS[s].label + '</button>';
        }).join('') + '</div></div>' : '<div class="notice mt">' + UI.icon('lock', 'sm') + '<span>Somente o responsável ou um adulto pode atualizar esta tarefa.</span></div>'),
      foot: manage ? '<button class="btn btn-danger" id="tDel" style="flex:0 0 auto">' + UI.icon('trash-2') + '</button><button class="btn btn-ghost" id="tEdit">' + UI.icon('pencil') + ' Editar</button>' : null,
      onMount: function (el, close) {
        el.querySelectorAll('[data-st]').forEach(function (b) {
          b.onclick = function () {
            if (b.dataset.st === t.status) return;
            close(); setStatus(t, b.dataset.st);
          };
        });
        var ed = el.querySelector('#tEdit');
        if (ed) ed.onclick = function () { close(); form(t, App.reload); };
        var del = el.querySelector('#tDel');
        if (del) del.onclick = function () {
          UI.confirm({ title: 'Excluir tarefa?', message: '"' + t.title + '" será removida.', ok: 'Excluir', danger: true, icon: 'trash-2' }).then(function (ok) {
            if (!ok) return;
            App.api('tasks.delete', { taskId: t.taskId }).then(function () { UI.toast('Tarefa excluída'); close(); data = null; App.reload(); }, function (e) { UI.toast(e.message, 'error'); });
          });
        };
      }
    });
  }

  function form(task, onDone) {
    var changed = false;
    var isNew = !task;
    task = task || { priority: 'MEDIUM', status: 'TODO' };
    ensure().then(function (d) {
      UI.sheet({
        title: isNew ? 'Nova tarefa' : 'Editar tarefa',
        body: '<form id="tForm">' +
          UI.field('Título', UI.input('title', task.title, 'maxlength="80" placeholder="ex.: Limpar a geladeira"')) +
          UI.field('Descrição', '<textarea class="input" name="description" maxlength="500" placeholder="Detalhes (opcional)">' + UI.esc(task.description || '') + '</textarea>') +
          '<div class="grid2">' + UI.field('Responsável', UI.select('responsibleId', [{ value: '', label: 'Ninguém' }].concat(d.members.map(function (m) { return { value: m.memberId, label: m.name }; })), task.responsibleId)) +
          UI.field('Prazo', UI.input('dueDate', task.dueDate, 'type="date"')) + '</div>' +
          UI.field('Prioridade', UI.options('priority', [
            { value: 'LOW', label: 'Baixa', icon: 'arrow-down' }, { value: 'MEDIUM', label: 'Média', icon: 'minus' }, { value: 'HIGH', label: 'Alta', icon: 'arrow-up' }
          ], task.priority)) +
          UI.field('Status', UI.options('status', Object.keys(STATUS).map(function (s) { return { value: s, label: STATUS[s].label, icon: STATUS[s].icon }; }), task.status)) +
          '</form>',
        full: true,
        foot: '<button class="btn btn-ghost" data-close>Cancelar</button>' +
          (isNew ? '<button class="btn btn-ghost" id="tSaveAgain">Salvar e adicionar outro</button>' : '') +
          '<button class="btn btn-primary btn-full" id="tSave">Salvar</button>',
        onClose: function () { if (changed && onDone) onDone(); },
        onMount: function (el, close) {
          var f = el.querySelector('#tForm');
          UI.bindOptions(f);
          function save(again) {
            var v = UI.formData(f);
            if (!v.title.trim()) return UI.toast('Informe o título.', 'error');
            if (!isNew) v.taskId = task.taskId;
            UI.run(el.querySelector(again ? '#tSaveAgain' : '#tSave'), function () { return App.api(isNew ? 'tasks.create' : 'tasks.update', v); }, isNew ? 'Tarefa criada' : 'Tarefa atualizada')
              .then(function () {
                changed = true; data = null;
                if (!again) return close();
                ['title', 'description', 'dueDate'].forEach(function (k) { if (f[k]) f[k].value = ''; });
                f.title.focus();
              }, function () {});
          }
          el.querySelector('#tSave').onclick = function () { save(false); };
          var ag = el.querySelector('#tSaveAgain');
          if (ag) ag.onclick = function () { save(true); };
          f.onsubmit = function (e) { e.preventDefault(); save(false); };
        }
      });
    }, function (e) { UI.toast(e.message, 'error'); });
  }

  App.register('house', { title: 'Casa', render: render, perm: 'tasks.view' });
  return { form: form };
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Family.html
 * Gestão familiar (moradores, perfis, PIN, bloqueio, atividades) e Meu perfil.
 * ===================================================================== */
var Family = (function () {
  var COLORS = ['#269B71', '#174F3C', '#E9B44C', '#D96565', '#4C7FE9', '#8E6CD9', '#2FA3B5', '#C9773D'];
  var ROLES = [
    { value: 'ADMIN', label: 'Administrador', icon: 'crown' },
    { value: 'ADULT', label: 'Adulto', icon: 'user-round' },
    { value: 'MEMBER', label: 'Membro', icon: 'smile' }
  ];
  var ROLE_INFO = {
    ADMIN: 'Acesso total: moradores, permissões, orçamento, produtos, categorias e histórico.',
    ADULT: 'Gerencia listas, estoque, compras e afazeres; consulta o orçamento.',
    MEMBER: 'Consulta listas, registra consumo e atualiza as tarefas atribuídas a ele.'
  };
  var ROLE_BADGE = { ADMIN: 'b-green', ADULT: 'b-blue', MEMBER: 'b-gray' };

  function render(el) {
    App.setHeader('Família', App.state.session.household.name);
    el.innerHTML = UI.skeleton([72, 72, 72]);
    if (App.can('members.manage')) App.fab({ label: 'Morador', icon: 'user-plus', onClick: function () { memberForm(null); } });
    App.api('members.list').then(function (list) {
      if (App.state.view !== 'family') return;
      var manage = App.can('members.manage');
      el.innerHTML = '<div class="list">' + list.map(function (m) {
        var status = m.blocked ? '<span class="badge b-red">Bloqueado</span>' : m.pinLocked ? '<span class="badge b-yellow">PIN bloqueado</span>' : '';
        return '<' + (manage ? 'button' : 'div') + ' class="row" data-mid="' + m.memberId + '">' + UI.avatar(m.name, m.color) +
          '<span class="main"><span class="t">' + UI.esc(m.name) + (m.memberId === App.me().memberId ? ' <span class="muted" style="font-weight:500">(você)</span>' : '') + '</span>' +
          '<span class="s">' + (manage ? (m.lastAccessAt ? 'Último acesso ' + UI.relative(m.lastAccessAt) : 'Ainda não acessou') : UI.esc(m.roleLabel)) + '</span></span>' +
          '<span class="end" style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="badge ' + ROLE_BADGE[m.role] + '">' + UI.esc(m.roleLabel) + '</span>' + status + '</span>' +
          '</' + (manage ? 'button' : 'div') + '>';
      }).join('') + '</div>' +
        '<div class="section"><div class="section-head"><h3>Perfis de acesso</h3></div><div class="list">' + ROLES.map(function (r) {
          return '<div class="row"><span class="lead-ic">' + UI.icon(r.icon) + '</span><div class="main"><div class="t">' + r.label + '</div>' +
            '<div class="s" style="white-space:normal">' + ROLE_INFO[r.value] + '</div></div></div>';
        }).join('') + '</div></div>' +
        '<div class="notice info mt">' + UI.icon('shield-check', 'sm') + '<span>Todos usam o mesmo acesso da residência, mas cada ação é registrada no nome do morador que informou o PIN.</span></div>';
      if (manage) el.querySelectorAll('[data-mid]').forEach(function (b) {
        b.onclick = function () { memberSheet(list.filter(function (m) { return m.memberId === b.dataset.mid; })[0]); };
      });
      UI.refreshIcons();
    }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      el.innerHTML = UI.empty('cloud-off', 'Não foi possível carregar', e.message);
      UI.refreshIcons();
    });
  }

  function memberSheet(m) {
    var self = m.memberId === App.me().memberId;
    var acts = [
      { icon: 'pencil', label: 'Editar nome, perfil e cor', onClick: function () { memberForm(m); } },
      { icon: 'key-round', label: 'Redefinir PIN', hint: m.pinLocked ? 'PIN bloqueado por tentativas — redefinir desbloqueia' : '', onClick: function () { pinForm(m); } },
      { icon: 'activity', label: 'Consultar atividades', onClick: function () { activitySheet(m); } }
    ];
    if (!self) acts.push(m.blocked ?
      { icon: 'lock-open', label: 'Desbloquear morador', onClick: function () { setBlocked(m, false); } } :
      { icon: 'ban', label: 'Bloquear morador', tone: 'red', hint: 'Impede o acesso ao perfil', onClick: function () { setBlocked(m, true); } });
    var s = UI.actions(m.name, acts);
    var head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:center;gap:12px;padding:4px 2px 16px';
    head.innerHTML = UI.avatar(m.name, m.color, 'lg') + '<div><div style="font-weight:700;font-size:17px">' + UI.esc(m.name) + '</div>' +
      '<div class="muted" style="font-size:13px">' + UI.esc(m.roleLabel) + ' · ' + (m.lastAccessAt ? 'acesso ' + UI.relative(m.lastAccessAt) : 'nunca acessou') + '</div></div>';
    s.el.querySelector('.sheet-body').prepend(head);
  }

  function setBlocked(m, blocked) {
    UI.confirm({
      title: blocked ? 'Bloquear ' + m.name + '?' : 'Desbloquear ' + m.name + '?',
      message: blocked ? 'O perfil não poderá mais ser selecionado e as sessões abertas dele serão encerradas.' : 'O morador voltará a acessar o HomeFlow com o PIN dele.',
      ok: blocked ? 'Bloquear' : 'Desbloquear', danger: blocked, icon: blocked ? 'ban' : 'lock-open'
    }).then(function (ok) {
      if (!ok) return;
      App.api('members.setBlocked', { memberId: m.memberId, blocked: blocked }).then(function () {
        UI.toast(blocked ? 'Morador bloqueado' : 'Morador desbloqueado'); App.reload();
      }, function (e) { UI.toast(e.message, 'error'); });
    });
  }

  function memberForm(m, onDone) {
    var isNew = !m;
    m = m || { role: 'ADULT', color: COLORS[1] };
    UI.sheet({
      title: isNew ? 'Novo morador' : 'Editar morador',
      full: true,
      body: '<form id="mForm">' + UI.field('Nome', UI.input('name', m.name, 'maxlength="40" placeholder="Nome do morador"')) +
        UI.field('Perfil', UI.options('role', ROLES, m.role), ROLE_INFO[m.role]) +
        (isNew ? '<div class="grid2">' + UI.field('PIN inicial', '<input class="input num" type="password" name="pin" inputmode="numeric" maxlength="6" placeholder="4 a 6 dígitos">') +
          UI.field('Confirmar PIN', '<input class="input num" type="password" name="pin2" inputmode="numeric" maxlength="6">') + '</div>' +
          '<div class="notice info" style="margin-bottom:14px">' + UI.icon('info', 'sm') + '<span>Informe o PIN ao morador. Ele poderá trocá-lo em "Meu perfil".</span></div>' :
          UI.field('Cor', '<div class="color-dots">' + COLORS.map(function (c) { return '<button type="button" data-c="' + c + '" class="' + (c === m.color ? 'on' : '') + '" style="background:' + c + '"></button>'; }).join('') +
            '</div><input type="hidden" name="color" value="' + UI.esc(m.color) + '">')) +
        '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="mSave">' + (isNew ? 'Adicionar' : 'Salvar') + '</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#mForm');
        UI.bindOptions(f, function (name, v) {
          var help = f.querySelector('[data-opts="role"]').parentNode.querySelector('.help');
          if (help) help.textContent = ROLE_INFO[v];
        });
        f.querySelectorAll('[data-c]').forEach(function (b) {
          b.onclick = function () { f.querySelectorAll('[data-c]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); f.color.value = b.dataset.c; };
        });
        function save() {
          var v = UI.formData(f);
          if (!v.name.trim()) return UI.toast('Informe o nome.', 'error');
          if (isNew) {
            if (!/^\d{4,6}$/.test(v.pin)) return UI.toast('O PIN deve ter de 4 a 6 dígitos.', 'error');
            if (v.pin !== v.pin2) return UI.toast('Os PINs não conferem.', 'error');
          } else v.memberId = m.memberId;
          delete v.pin2;
          UI.run(el.querySelector('#mSave'), function () { return App.api(isNew ? 'members.create' : 'members.update', v); }, isNew ? 'Morador adicionado' : 'Morador atualizado')
            .then(function (r) {
              close();
              if (!isNew && m.memberId === App.me().memberId) App.api('auth.session').then(function (s) { App.state.session = s; App.setSession(s); App.go('family', {}); });
              else if (onDone) onDone();
              else if (App.state.view === 'family' || App.state.view === 'home') App.reload();
            }, function () {});
        }
        el.querySelector('#mSave').onclick = save;
        f.onsubmit = function (e) { e.preventDefault(); save(); };
      }
    });
  }

  function pinForm(m) {
    UI.sheet({
      title: 'Redefinir PIN de ' + m.name.split(' ')[0],
      body: '<form id="rpF"><div class="grid2">' + UI.field('Novo PIN', '<input class="input num" type="password" name="pin" inputmode="numeric" maxlength="6" placeholder="4 a 6 dígitos">') +
        UI.field('Confirmar', '<input class="input num" type="password" name="pin2" inputmode="numeric" maxlength="6">') + '</div>' +
        '<div class="notice">' + UI.icon('triangle-alert', 'sm') + '<span>O morador precisará usar o novo PIN. Bloqueios por tentativas serão removidos.</span></div></form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="rpOk">Redefinir</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#rpF');
        function ok() {
          var v = UI.formData(f);
          if (!/^\d{4,6}$/.test(v.pin)) return UI.toast('O PIN deve ter de 4 a 6 dígitos.', 'error');
          if (v.pin !== v.pin2) return UI.toast('Os PINs não conferem.', 'error');
          UI.run(el.querySelector('#rpOk'), function () { return App.api('members.resetPin', { memberId: m.memberId, pin: v.pin }); }, 'PIN redefinido').then(function () { close(); App.reload(); }, function () {});
        }
        el.querySelector('#rpOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
      }
    });
  }

  function activitySheet(m) {
    var s = UI.sheet({ title: 'Atividades de ' + m.name.split(' ')[0], body: '<div id="actList">' + UI.skeleton([56, 56, 56]) + '</div>' });
    App.api('members.activity', { memberId: m.memberId }).then(function (r) {
      var box = s.el.querySelector('#actList');
      if (!box) return;
      box.innerHTML = r.items.length ? '<div class="list">' + r.items.map(Settings.logRow).join('') + '</div>' : UI.empty('activity', 'Sem atividades', 'Nenhuma ação registrada para este morador.');
      UI.refreshIcons();
    }, function (e) { UI.toast(e.message, 'error'); s.close(); });
  }

  // ---------------- Meu perfil ----------------
  function renderProfile(el) {
    var m = App.me();
    App.setHeader('Meu perfil', App.state.session.household.name);
    var perms = App.state.session.permissions;
    el.innerHTML = '<div class="card center" style="padding:26px 18px">' +
        '<div style="display:flex;justify-content:center;margin-bottom:12px">' + UI.avatar(m.name, m.color, 'lg') + '</div>' +
        '<h2 style="font-size:21px">' + UI.esc(m.name) + '</h2>' +
        '<span class="badge ' + ROLE_BADGE[m.role] + '" style="margin-top:8px">' + UI.esc(m.roleLabel) + '</span>' +
        '<p class="muted" style="font-size:13.5px;margin:12px 0 0">' + ROLE_INFO[m.role] + '</p></div>' +
      '<div class="section"><div class="section-head"><h3>Segurança</h3></div>' +
        '<div class="list"><button class="row" id="chPin"><span class="lead-ic">' + UI.icon('key-round') + '</span><span class="main"><span class="t">Alterar meu PIN</span><span class="s">Use um PIN que só você conheça</span></span>' + UI.icon('chevron-right', 'sm muted') + '</button>' +
        '<button class="row" id="swMember"><span class="lead-ic">' + UI.icon('repeat-2') + '</span><span class="main"><span class="t">Trocar morador</span><span class="s">Outra pessoa vai usar este dispositivo</span></span>' + UI.icon('chevron-right', 'sm muted') + '</button></div></div>' +
      '<div class="notice info mt">' + UI.icon('info', 'sm') + '<span>' + (perms.indexOf('*') !== -1 ? 'Você tem acesso total à residência.' : 'Algumas ações ficam ocultas de acordo com o seu perfil. Fale com o administrador se precisar de mais acesso.') + '</span></div>';
    document.getElementById('chPin').onclick = changePin;
    document.getElementById('swMember').onclick = function () {
      App.api('auth.switchMember').then(function (s) { App.state.session = s; Auth.showProfiles(); }, function (e) { UI.toast(e.message, 'error'); });
    };
    UI.refreshIcons();
  }

  function changePin() {
    UI.sheet({
      title: 'Alterar meu PIN',
      body: '<form id="cpF">' + UI.field('PIN atual', '<input class="input num" type="password" name="currentPin" inputmode="numeric" maxlength="6">') +
        '<div class="grid2">' + UI.field('Novo PIN', '<input class="input num" type="password" name="newPin" inputmode="numeric" maxlength="6" placeholder="4 a 6 dígitos">') +
        UI.field('Confirmar', '<input class="input num" type="password" name="newPin2" inputmode="numeric" maxlength="6">') + '</div></form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="cpOk">Alterar PIN</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#cpF');
        function ok() {
          var v = UI.formData(f);
          if (!/^\d{4,6}$/.test(v.newPin)) return UI.toast('O novo PIN deve ter de 4 a 6 dígitos.', 'error');
          if (v.newPin !== v.newPin2) return UI.toast('Os PINs não conferem.', 'error');
          UI.run(el.querySelector('#cpOk'), function () { return App.api('profile.changePin', { currentPin: v.currentPin, newPin: v.newPin }); }, 'PIN alterado com sucesso').then(close, function () {});
        }
        el.querySelector('#cpOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
      }
    });
  }

  App.register('family', { title: 'Família', tab: null, render: render, perm: 'members.view' });
  App.register('profile', { title: 'Meu perfil', tab: null, render: renderProfile });
  return { memberForm: memberForm };
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Settings.html
 * Configurações (residência, orçamento, segurança, dados) e Histórico.
 * ===================================================================== */
var Settings = (function () {

  function render(el) {
    App.setHeader('Residência', App.state.session.household.name);
    el.innerHTML = UI.skeleton([120, 120, 160]);
    App.api('settings.get').then(function (s) {
      if (App.state.view !== 'settings') return;
      var admin = s.admin;
      var html = '';

      html += '<div class="section-head"><h3>Residência</h3></div><div class="list">' +
        row('house', 'Nome da residência', s.household.name, App.can('settings.manage') ? 'editName' : null) +
        row('calendar', 'Criada em', UI.dateShort(s.household.createdAt) + '/' + String(s.household.createdAt).slice(0, 4)) +
        row('coins', 'Moeda', 'Real brasileiro (R$)') + '</div>';

      if (App.can('budget.view')) {
        html += '<div class="section"><div class="section-head"><h3>Orçamento do mercado</h3></div><div class="list">' +
          row('wallet', UI.monthLabel(s.month, true).replace(/^./, function (c) { return c.toUpperCase(); }),
            s.budget ? UI.money(s.budget.amount) : 'Não definido', App.can('budget.manage') ? 'editBudget' : null) + '</div>' +
          (App.can('budget.manage') ? '<div class="muted" style="font-size:12.5px;margin:8px 4px 0">O orçamento é mensal. Os gastos vêm das compras registradas no Mercado.</div>' : '') + '</div>';
      }

      if (admin) {
        html += '<div class="section"><div class="section-head"><h3>Acesso e segurança</h3></div><div class="list">' +
          row('at-sign', 'Identificador', admin.identifier) +
          row('lock-keyhole', 'Alterar senha compartilhada', 'Encerra as sessões nos outros dispositivos', 'changePwd') +
          row('monitor-smartphone', 'Sessões ativas', admin.activeSessions + ' dispositivo(s) · encerrar outras', 'endSessions') +
          row('clock', 'Último login da residência', admin.lastLoginAt ? UI.relative(admin.lastLoginAt) : '—') + '</div></div>';

        html += '<div class="section"><div class="section-head"><h3>Dados</h3></div><div class="list">' +
          link('sheet', 'Banco de dados (Google Sheets)', 'Somente o proprietário do script tem acesso', admin.databaseUrl) +
          link('folder-open', 'Pasta no Google Drive', 'Notas fiscais, anexos e exportações', admin.driveFolderUrl) + '</div></div>';
      }

      html += '<div class="section"><div class="section-head"><h3>Sobre</h3></div><div class="card" style="padding:4px 16px">' +
        '<div class="kv"><span>Aplicativo</span><strong>' + UI.esc(s.app.name) + ' ' + UI.esc(s.app.version) + '</strong></div>' +
        '<div class="kv"><span>PIN</span><strong>' + UI.esc(s.security.pinLength) + ' dígitos</strong></div>' +
        '<div class="kv"><span>Sessão</span><strong>' + s.security.sessionHours + ' h · ' + s.security.rememberDays + ' dias se "manter conectado"</strong></div>' +
        '<div class="kv"><span>Pedir PIN após inatividade</span><strong>' + Math.round(s.security.idleMinutes / 60) + ' h</strong></div></div></div>';

      el.innerHTML = html;
      bind(el, 'editName', function () { editName(s.household.name); });
      bind(el, 'editBudget', function () { budgetForm(s.budget ? s.budget.amount : null, App.reload); });
      bind(el, 'changePwd', changePassword);
      bind(el, 'endSessions', endSessions);
      UI.refreshIcons();
    }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      el.innerHTML = UI.empty('cloud-off', 'Não foi possível carregar', e.message);
      UI.refreshIcons();
    });
  }

  function row(ic, title, sub, action) {
    var tag = action ? 'button' : 'div';
    return '<' + tag + ' class="row"' + (action ? ' data-act="' + action + '"' : '') + '><span class="lead-ic">' + UI.icon(ic) + '</span>' +
      '<span class="main"><span class="t">' + UI.esc(title) + '</span><span class="s">' + UI.esc(sub) + '</span></span>' +
      (action ? UI.icon('chevron-right', 'sm muted') : '') + '</' + tag + '>';
  }

  function link(ic, title, sub, url) {
    return '<a class="row" href="' + UI.esc(url) + '" target="_blank" rel="noopener noreferrer" style="color:inherit"><span class="lead-ic">' + UI.icon(ic) + '</span>' +
      '<span class="main"><span class="t">' + UI.esc(title) + '</span><span class="s">' + UI.esc(sub) + '</span></span>' + UI.icon('external-link', 'sm muted') + '</a>';
  }

  function bind(el, act, fn) { var b = el.querySelector('[data-act="' + act + '"]'); if (b) b.onclick = fn; }

  function editName(current) {
    UI.sheet({
      title: 'Nome da residência',
      body: '<form id="hnF">' + UI.field('Nome', UI.input('name', current, 'maxlength="60"')) + '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="hnOk">Salvar</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#hnF');
        function ok() {
          UI.run(el.querySelector('#hnOk'), function () { return App.api('settings.household', { name: f.name.value }); }, 'Nome atualizado').then(function (r) {
            App.state.session.household.name = r.name; close(); App.reload();
          }, function () {});
        }
        el.querySelector('#hnOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
      }
    });
  }

  /** Definir o orçamento mensal do mercado (mês atual). */
  function budgetForm(current, onDone) {
    UI.sheet({
      title: 'Orçamento do mercado',
      body: '<form id="bgF">' + UI.field('Valor para este mês', UI.moneyInput('amount', current || '', 'style="font-size:20px;font-weight:700"'),
        'Quanto a casa pretende gastar com mercado no mês atual.') + '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="bgOk">Salvar orçamento</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#bgF');
        function ok() {
          var v = UI.parseMoney(f.amount.value);
          if (v === '' || isNaN(v) || v < 0) return UI.toast('Informe um valor válido.', 'error');
          UI.run(el.querySelector('#bgOk'), function () { return App.api('settings.budget', { amount: v }); }, 'Orçamento definido').then(function () { close(); if (onDone) onDone(); }, function () {});
        }
        el.querySelector('#bgOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
        if (window.innerWidth > 700) f.amount.focus();
      }
    });
  }

  function changePassword() {
    UI.sheet({
      title: 'Alterar senha compartilhada',
      body: '<form id="pwF">' + UI.field('Senha atual', UI.passwordInput('currentPassword', 'autocomplete="current-password"')) +
        UI.field('Nova senha', UI.passwordInput('newPassword', 'autocomplete="new-password" placeholder="8+ caracteres, letras e números"')) +
        UI.field('Confirmar nova senha', UI.passwordInput('newPassword2', 'autocomplete="new-password"')) +
        '<div class="notice">' + UI.icon('triangle-alert', 'sm') + '<span>Todos os outros dispositivos serão desconectados e precisarão da nova senha.</span></div></form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="pwOk">Alterar senha</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#pwF');
        UI.bindEyes(f);
        function ok() {
          var v = UI.formData(f);
          if (v.newPassword !== v.newPassword2) return UI.toast('As senhas não conferem.', 'error');
          UI.run(el.querySelector('#pwOk'), function () { return App.api('settings.password', { currentPassword: v.currentPassword, newPassword: v.newPassword }); })
            .then(function (r) { close(); UI.toast('Senha alterada · ' + r.revokedSessions + ' sessão(ões) encerrada(s)'); App.reload(); }, function () {});
        }
        el.querySelector('#pwOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
      }
    });
  }

  function endSessions() {
    UI.confirm({ title: 'Encerrar outras sessões?', message: 'Todos os outros dispositivos precisarão entrar novamente com identificador e senha.', ok: 'Encerrar', danger: true, icon: 'monitor-x' })
      .then(function (ok) {
        if (!ok) return;
        App.api('settings.endSessions').then(function (r) { UI.toast(r.revokedSessions + ' sessão(ões) encerrada(s)'); App.reload(); }, function (e) { UI.toast(e.message, 'error'); });
      });
  }

  // ---------------- Histórico ----------------
  function logRow(a) {
    var d = a.details || {};
    var extra = d.name || d.title || d.item || d.store || '';
    if (a.action === 'BUDGET_SET') extra = UI.money(d.amount) + ' · ' + UI.monthLabel(d.month, true);
    if (a.action === 'PURCHASE_CREATED') extra = (d.store || '') + ' · ' + UI.money(d.total);
    if (/^STOCK_/.test(a.action)) extra = (d.name || '') + ' · ' + (d.quantity > 0 && a.action !== 'STOCK_OUT' ? '+' : '') + UI.qty(a.action === 'STOCK_OUT' ? -d.quantity : d.quantity);
    return '<div class="row">' + UI.avatar(a.memberName, a.memberColor, 'sm') +
      '<div class="main"><div class="t" style="font-weight:500">' + UI.esc(a.label) + '</div>' +
      '<div class="s">' + (extra ? UI.esc(extra) + ' · ' : '') + UI.esc(a.memberName) + '</div></div>' +
      '<span class="muted end" style="font-size:12px">' + UI.relative(a.createdAt) + '</span></div>';
  }

  function renderHistory(el) {
    App.setHeader('Histórico', 'Quem fez o quê e quando');
    var state = { offset: 0, memberId: '', items: [] };
    el.innerHTML = '<div class="chips" id="hChips"></div><div id="hList">' + UI.skeleton([56, 56, 56, 56]) + '</div>';
    App.api('members.list').then(function (members) {
      var chips = document.getElementById('hChips');
      if (!chips) return;
      chips.innerHTML = '<button class="chip on" data-m="">Todos</button>' + members.map(function (m) {
        return '<button class="chip" data-m="' + m.memberId + '">' + UI.esc(m.name.split(' ')[0]) + '</button>';
      }).join('');
      chips.querySelectorAll('[data-m]').forEach(function (b) {
        b.onclick = function () {
          chips.querySelectorAll('[data-m]').forEach(function (x) { x.classList.toggle('on', x === b); });
          state = { offset: 0, memberId: b.dataset.m, items: [] };
          document.getElementById('hList').innerHTML = UI.skeleton([56, 56, 56]);
          page();
        };
      });
    }, function () {});
    function page(btn) {
      var p = App.api('history.list', { offset: state.offset, limit: 40, memberId: state.memberId });
      (btn ? UI.run(btn, function () { return p; }) : p).then(function (r) {
        var box = document.getElementById('hList');
        if (!box) return;
        state.items = state.items.concat(r.items);
        state.offset += r.items.length;
        box.innerHTML = state.items.length ? '<div class="list">' + state.items.map(logRow).join('') + '</div>' +
          (r.hasMore ? '<button class="btn btn-ghost btn-block mt" id="more">Carregar mais</button>' : '<div class="muted center mt" style="font-size:12.5px">' + r.total + ' registro(s)</div>') :
          '<div class="card">' + UI.empty('history', 'Sem registros', 'As ações realizadas aparecerão aqui.') + '</div>';
        var more = document.getElementById('more');
        if (more) more.onclick = function () { page(more); };
        UI.refreshIcons();
      }, function (e) { if (!btn) UI.toast(e.message, 'error'); });
    }
    page();
  }

  App.register('settings', { title: 'Residência', render: render });
  App.register('history', { title: 'Histórico', render: renderHistory, perm: 'history.view' });
  return { budgetForm: budgetForm, logRow: logRow };
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Ajustes (como a aba Ajustes do app de finanças)
 * Reúne: quem está usando, família, residência, histórico, aparência,
 * este aparelho (servidor + convite), versão e saída.
 * ===================================================================== */
(function () {
  function linha(id, ic, t, s, extra) {
    return '<button type="button" class="row" id="' + id + '"><span class="lead-ic">' + UI.icon(ic) + '</span>' +
      '<span class="main"><span class="t">' + UI.esc(t) + '</span>' + (s ? '<span class="s">' + UI.esc(s) + '</span>' : '') + '</span>' +
      (extra || UI.icon('chevron-right', 'sm muted')) + '</button>';
  }

  function render(el) {
    var m = App.me();
    App.setHeader('Ajustes', App.state.session.household.name);
    var casa = '';
    if (App.can('members.view') && moduloAtivo('familia')) casa += linha('ajFamilia', 'users-round', 'Família', App.can('members.manage') ? 'Moradores, perfis e PINs' : 'Quem mora na casa');
    casa += linha('ajResid', 'house-plug', 'Residência', App.can('settings.manage') ? 'Nome, orçamento, senha e dados' : 'Informações da residência');
    if (App.can('history.view') && moduloAtivo('historico')) casa += linha('ajHist', 'history', 'Histórico', 'Quem fez o quê e quando');
    var tema = Tema.atual();

    el.innerHTML =
      '<div class="card membro-card">' + UI.avatar(m.name, m.color, 'lg') +
        '<div class="info"><strong>' + UI.esc(m.name) + '</strong><span class="badge b-green">' + UI.esc(m.roleLabel) + '</span></div>' +
        '<button class="btn btn-ghost btn-sm" id="ajTrocar">' + UI.icon('repeat-2', 'sm') + ' Trocar</button></div>' +

      '<div class="section"><div class="section-head"><h3>Você</h3></div><div class="list">' +
        linha('ajPerfil', 'user-round', 'Meu perfil', 'Alterar meu PIN') + '</div></div>' +

      '<div class="section"><div class="section-head"><h3>Casa</h3></div><div class="list">' + casa + '</div></div>' +

      '<div class="section"><div class="section-head"><h3>Aparência</h3></div><div class="card">' +
        '<div class="tema-opcoes">' + [['light', 'sun', 'Claro'], ['dark', 'moon', 'Escuro'], ['auto', 'monitor-smartphone', 'Automático']].map(function (t) {
          return '<button type="button" class="opt' + (tema === t[0] ? ' on' : '') + '" data-tema="' + t[0] + '">' + UI.icon(t[1]) + t[2] + '</button>';
        }).join('') + '</div>' +
        UI.switchRow('ocultar', 'Esconder valores', Ocultar.ativo(), 'Embaça os valores em dinheiro no Início') + '</div></div>' +

      '<div class="section"><div class="section-head"><h3>Este aparelho</h3></div><div class="card">' +
        '<div style="font-weight:600">Servidor da casa</div><div class="endereco">' + UI.esc(Servidor.url()) + '</div>' +
        '<div class="btn-row"><button class="btn btn-soft btn-sm" id="ajConvite">' + UI.icon('share-2', 'sm') + ' Link de convite</button>' +
        '<button class="btn btn-ghost btn-sm" id="ajTestar">' + UI.icon('wifi', 'sm') + ' Testar conexão</button></div>' +
        '<p class="muted" style="font-size:12.5px;margin:10px 0 0">O link abre o HomeFlow já conectado a esta casa. Quem recebe ainda precisa do identificador, da senha e do próprio PIN.</p>' +
      '</div></div>' +

      '<div class="section" id="ajVersao"><div class="section-head"><h3>Versão</h3></div><div class="card">' +
        '<p class="versao-txt">' + UI.esc(Versao.texto()) + ' Etapa liberada: MVP ' + NIVEL + '.</p>' +
        '<button class="btn btn-ghost btn-sm" id="ajAtualizar">' + UI.icon('refresh-cw', 'sm') + ' Procurar atualização</button></div></div>' +

      '<div class="section"><div class="list zona-perigo">' +
        '<button type="button" class="row" id="ajSair"><span class="lead-ic" style="background:var(--red-soft);color:var(--red)">' + UI.icon('log-out') + '</span>' +
        '<span class="main"><span class="t" style="color:var(--red)">Sair da residência</span><span class="s">Desconecta este aparelho</span></span></button></div></div>';

    var on = function (id, fn) { var b = el.querySelector('#' + id); if (b) b.onclick = fn; };
    on('ajTrocar', App.switchMember);
    on('ajPerfil', function () { App.go('profile', {}, { push: true }); });
    on('ajFamilia', function () { App.go('family', {}, { push: true }); });
    on('ajResid', function () { App.go('settings', {}, { push: true }); });
    on('ajHist', function () { App.go('history', {}, { push: true }); });
    on('ajSair', App.logout);
    on('ajAtualizar', function () { Versao.procurar(el.querySelector('#ajAtualizar')); });
    el.querySelectorAll('[data-tema]').forEach(function (b) {
      b.onclick = function () {
        Tema.aplicar(b.dataset.tema);
        el.querySelectorAll('[data-tema]').forEach(function (x) { x.classList.toggle('on', x === b); });
      };
    });
    var sw = el.querySelector('[data-switch="ocultar"]');
    UI.bindSwitches(el);
    if (sw) sw.addEventListener('click', function () { Ocultar.alternar(); });
    on('ajConvite', function () {
      var link = Servidor.convite();
      var texto = 'Entre no HomeFlow da ' + App.state.session.household.name + ': ' + link;
      if (navigator.share) {
        navigator.share({ title: 'HomeFlow', text: texto }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () { UI.toast('Link de convite copiado'); }, function () { mostrarLink(link); });
      } else mostrarLink(link);
    });
    on('ajTestar', function () {
      var b = el.querySelector('#ajTestar'), t0 = Date.now();
      UI.run(b, function () { return App.api('auth.status'); }).then(function () {
        UI.toast('Servidor respondendo (' + ((Date.now() - t0) / 1000).toFixed(1).replace('.', ',') + ' s)');
      }, function () {});
    });
  }

  function mostrarLink(link) {
    UI.sheet({ title: 'Link de convite', body: '<p class="muted" style="margin-top:0">Copie e envie para quem mora com você:</p><div class="endereco" style="user-select:all">' + UI.esc(link) + '</div>' });
  }

  App.register('ajustes', { title: 'Ajustes', render: render });
})();
</script>
<script>
  App.start();
  /* Modo app (PWA): guarda o código e os ícones para abrir rápido e sem internet. Os dados ficam na planilha. */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* sem modo offline aqui */ }); });
  }
</script>
