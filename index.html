        (App.state.status && !App.state.status.needsSetup ? '<div class="center mt"><button class="link-btn" id="toLogin">Já tenho acesso</button></div>' : '') +
        foot() + '</div>';
      var f = document.getElementById('setupForm');
      UI.bindEyes(f); UI.bindSwitches(f);
      var first = f.querySelector('input:not([type=hidden]):not(.hidden)');
      if (first && window.innerWidth > 700) first.focus();
      var prev = document.getElementById('prevBtn');
      if (prev) prev.onclick = function () { Object.assign(data, UI.formData(f)); step--; render(); };
      var tl = document.getElementById('toLogin');
      if (tl) tl.onclick = showLogin;
      bindFoot();
      f.onsubmit = function (e) {
        e.preventDefault();
        var d = UI.formData(f);
        var err = s.check(d);
        if (err) return UI.toast(err, 'error');
        Object.assign(data, d);
        if (step < steps.length - 1) { step++; return render(); }
        UI.run(document.getElementById('nextBtn'), function () {
          return App.api('auth.setup', {
            householdName: data.householdName, identifier: data.identifier, password: data.password,
            adminName: data.adminName, pin: data.pin, remember: data.remember
          });
        }, 'Residência criada com sucesso!').then(function (r) {
          Store.setToken(r.token, data.remember);
          App.state.status.needsSetup = false;
          App.setSession(r.session, true);
        }, function () {});
      };
      UI.refreshIcons();
    }
    render();
  }

  // ---------- Seleção de morador ----------
  function showProfiles() {
    window.onscroll = null;
    var hh = App.state.session ? App.state.session.household.name : '';
    root().innerHTML = '<div class="auth">' + brandHead() +
      '<h1>Quem está usando?</h1><p class="lead">' + (hh ? UI.esc(hh) + ' · ' : '') + 'Selecione seu perfil e informe seu PIN.</p>' +
      '<div id="profiles">' + '<div class="profiles">' + [1, 2, 3].map(function () { return '<div class="skel" style="height:140px"></div>'; }).join('') + '</div></div>' +
      '<div class="center" style="margin-top:28px"><button class="link-btn" id="leave">' + UI.icon('log-out', 'sm') + ' Sair da residência</button></div>' +
      foot() + '</div>';
    document.getElementById('leave').onclick = App.logout;
    bindFoot();
    UI.refreshIcons();
    App.api('auth.profiles').then(function (list) {
      var box = document.getElementById('profiles');
      if (!box) return;
      box.innerHTML = '<div class="profiles">' + list.map(function (m, i) {
        return '<button class="profile-card' + (m.blocked ? ' disabled' : '') + '" data-i="' + i + '">' +
          UI.avatar(m.name, m.color, 'lg') + '<div class="name">' + UI.esc(m.name) + '</div>' +
          '<div class="role">' + (m.blocked ? 'Bloqueado' : m.locked ? 'PIN bloqueado' : UI.esc(m.roleLabel)) + '</div></button>';
      }).join('') + '</div>';
      box.querySelectorAll('[data-i]').forEach(function (b) {
        b.onclick = function () { showPin(list[Number(b.dataset.i)]); };
      });
      UI.refreshIcons();
    }, function (e) { if (e.code !== 'SESSION') UI.toast(e.message, 'error'); });
  }

  // ---------- PIN ----------
  function showPin(member) {
    var pin = '';
    var sending = false;
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
    root().innerHTML = '<div class="auth">' +
      '<div style="display:flex;align-items:center;margin-bottom:24px"><button class="icon-btn" id="pinBack" aria-label="Voltar">' + UI.icon('chevron-left') + '</button></div>' +
      '<div class="pin-wrap">' + UI.avatar(member.name, member.color, 'lg') +
        '<div class="center"><h1 style="font-size:22px;margin:0">Olá, ' + UI.esc(member.name.split(' ')[0]) + '</h1><p class="lead" style="margin:4px 0 0">Digite seu PIN</p></div>' +
        '<div class="pin-dots" id="dots"></div><div class="pin-msg" id="pinMsg"></div>' +
        '<div class="pinpad">' + keys.map(function (k) {
          if (k === 'del') return '<button data-k="del" class="ghost" aria-label="Apagar">' + UI.icon('delete') + '</button>';
          if (k === 'ok') return '<button data-k="ok" class="ghost" aria-label="Confirmar" style="color:var(--green)">' + UI.icon('circle-arrow-right', 'ico-lg') + '</button>';
          return '<button data-k="' + k + '">' + k + '</button>';
        }).join('') + '</div></div>' + foot() + '</div>';

    function draw() {
      var n = Math.max(4, pin.length);
      document.getElementById('dots').innerHTML = Array.apply(null, Array(n)).map(function (_, i) { return '<i class="' + (i < pin.length ? 'on' : '') + '"></i>'; }).join('');
    }
    function submit() {
      if (sending) return;
      if (pin.length < 4) return;
      sending = true;
      document.getElementById('pinMsg').innerHTML = '<span class="spinner" style="display:inline-block;width:16px;height:16px"></span>';
      App.api('auth.selectMember', { memberId: member.memberId, pin: pin }).then(function (s) {
        document.removeEventListener('keydown', onKey);
        App.setSession(s, true);
        UI.toast('Olá, ' + member.name.split(' ')[0] + '!');
      }, function (e) {
        sending = false; pin = ''; draw();
        var dots = document.getElementById('dots');
        if (!dots) return;
        dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
        document.getElementById('pinMsg').textContent = e.message;
        if (navigator.vibrate) { try { navigator.vibrate([40, 40, 40]); } catch (x) {} }
      });
    }
    function press(k) {
      if (sending) return;
      document.getElementById('pinMsg').textContent = '';
      if (k === 'del') pin = pin.slice(0, -1);
      else if (k === 'ok') return submit();
      else if (pin.length < 6) pin += k;
      draw();
      if (pin.length === 6) submit();
    }
    function onKey(e) {
      if (!document.getElementById('dots')) return document.removeEventListener('keydown', onKey);
      if (/^\d$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Enter') press('ok');
    }
    document.addEventListener('keydown', onKey);
    document.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { press(b.dataset.k); }; });
    document.getElementById('pinBack').onclick = function () { document.removeEventListener('keydown', onKey); showProfiles(); };
    draw();
    UI.refreshIcons();
  }

  return { showLogin: showLogin, showSetup: showSetup, showProfiles: showProfiles, showServer: showServer };
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Início
 * Mesma ordem do app de finanças: cartão principal com navegação de mês e
 * olho para esconder valores → saudação com a data → "Vamos começar?" →
 * próximos 7 dias → resumo da casa → evolução → atividade recente.
 * ===================================================================== */
(function () {
  var mesSel = null; // AAAA-MM exibido no cartão (null = mês atual)
  var DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

  function greeting() {
    var h = new Date().getHours();
    return h < 5 ? 'Boa noite' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  }

  function dataLonga() {
    var d = new Date();
    var s = DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + UI.monthLabel(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2), true);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function shiftMonth(ym, n) {
    var p = ym.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  function olho() {
    return '<button type="button" class="olho" id="btnOcultar" aria-pressed="' + Ocultar.ativo() + '" aria-label="Esconder valores" title="Esconder valores">' +
      UI.icon(Ocultar.ativo() ? 'eye-off' : 'eye', 'sm') + '</button>';
  }

  function heroFinance(f, d) {
    var atual = d.month === d.currentMonth;
    var nav = '<div class="mes-nav"><button type="button" class="seta" id="mesAnt" aria-label="Mês anterior">' + UI.icon('chevron-left') + '</button>' +
      '<button type="button" class="mes-rotulo" id="mesRotulo" title="Voltar para o mês atual">' + UI.esc(UI.monthLabel(d.month, true).replace(/^./, function (c) { return c.toUpperCase(); })) + '</button>' +
      '<button type="button" class="seta" id="mesProx" aria-label="Próximo mês"' + (atual ? ' disabled' : '') + '>' + UI.icon('chevron-right') + '</button></div>';
    if (f.budget === null) {
      return '<div class="hero">' + nav +
        '<div class="label">Gasto no mercado</div>' +
        '<div class="linha-valor"><div class="big num">' + UI.money(f.spent) + '</div>' + olho() + '</div>' +
        '<div class="sub">' + f.purchasesCount + ' compra(s) registrada(s) · sem orçamento definido</div>' +
        (App.can('budget.manage') && atual ? '<div class="hero-row"><div style="display:flex;align-items:center;gap:10px">' + UI.icon('target') +
          '<small style="flex:1">Defina quanto a casa pretende gastar no mês.</small>' +
          '<button class="btn btn-sm" style="background:#fff;color:#174F3C" id="setBudget">Definir</button></div></div>' : '') +
        '</div>';
    }
    var pct = f.percent || 0;
    var cls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : '';
    return '<div class="hero">' + nav +
      '<div class="label">' + (f.available < 0 ? 'Passou do orçamento' : 'Disponível no mês') + '</div>' +
      '<div class="linha-valor"><div class="big num">' + UI.money(f.available) + '</div>' + olho() + '</div>' +
      '<div class="meter ' + cls + '"><i style="width:0" data-w="' + Math.min(pct, 100) + '%"></i></div>' +
      '<div class="hero-row">' +
        '<div><small class="leg"><i style="background:#FFB3B3"></i>Gasto</small><strong class="num">' + UI.money(f.spent) + '</strong></div>' +
        '<div><small class="leg"><i style="background:#7FD8B3"></i>Orçamento</small><strong class="num">' + UI.money(f.budget) + '</strong></div>' +
        '<div><small>Consumido</small><strong class="num">' + (Math.round(pct * 10) / 10).toLocaleString('pt-BR') + '%</strong></div>' +
      '</div></div>';
  }

  /* Para quem não vê o orçamento (perfil Membro): o cartão mostra os afazeres da pessoa. */
  function heroMember(h) {
    return '<div class="hero"><div class="label">Seus afazeres</div>' +
      '<div class="big num">' + h.tasks.mine + '</div>' +
      '<div class="sub">' + (h.tasks.mine ? 'tarefa(s) atribuída(s) a você' : 'Nenhuma tarefa pendente para você') + '</div>' +
      '<div class="hero-row"><div><small>Em aberto na casa</small><strong class="num">' + h.tasks.open + '</strong></div>' +
      '<div><small>Atrasadas</small><strong class="num">' + h.tasks.overdue + '</strong></div></div></div>';
  }

  function onboarding(d) {
    if (!App.can('settings.manage') || Store.get('inicio-ok', false)) return '';
    var h = d.home;
    var passos = [
      { feito: h.budgetEverSet, t: 'Definir o orçamento do mercado', act: 'budget', b: 'Definir' },
      { feito: h.membersCount > 1, t: 'Adicionar os moradores', act: 'member', b: 'Adicionar', modulo: 'familia' },
      { feito: h.productsTotal > 0, t: 'Cadastrar produtos da despensa', act: 'product', b: 'Cadastrar', modulo: 'mercado' },
      { feito: h.tasksTotal > 0, t: 'Criar a primeira tarefa da casa', act: 'task', b: 'Criar', modulo: 'casa' }
    ].filter(function (p) { return !p.modulo || moduloAtivo(p.modulo); });
    var faltam = passos.filter(function (p) { return !p.feito; }).length;
    if (!faltam) return '';
    return '<div class="card"><h3 class="card-t"><span style="display:flex;align-items:center;gap:8px;color:var(--green)">' + UI.icon('sparkles') +
      '<span style="color:var(--text)">Vamos começar?</span></span>' +
      '<button class="icon-btn plain" id="obFechar" aria-label="Dispensar">' + UI.icon('x', 'sm') + '</button></h3>' +
      '<p class="muted" style="margin:0;font-size:13.5px">Toque no <b>+</b> para adicionar qualquer coisa. Para deixar a casa pronta:</p>' +
      '<ul class="passos">' + passos.map(function (p) {
        return '<li class="' + (p.feito ? 'feito' : '') + '"><span class="ok">' + UI.icon('check') + '</span><span class="t">' + p.t + '</span>' +
          (p.feito ? '' : '<button class="btn btn-soft btn-sm" data-ob="' + p.act + '">' + p.b + '</button>') + '</li>';
      }).join('') + '</ul></div>';
  }

  function upcomingCard(h) {
    if (!moduloAtivo('casa')) return '';
    return '<div class="card"><h3 class="card-t">Próximos 7 dias<button class="link-btn" data-go="house">Afazeres ' + UI.icon('chevron-right', 'sm') + '</button></h3>' +
      (h.upcoming.length ? '<div style="margin:6px -4px 0">' + h.upcoming.map(function (t) {
        return '<div class="row" style="padding:10px 4px;background:none">' +
          (t.responsibleName ? UI.avatar(t.responsibleName, t.responsibleColor, 'sm') : '<span class="avatar sm" style="background:var(--line);color:var(--muted)">?</span>') +
          '<div class="main"><div class="t" style="font-weight:600">' + UI.esc(t.title) + '</div>' +
          '<div class="s">' + (t.responsibleName ? UI.esc(t.responsibleName) + ' · ' : '') + '<span style="' + (t.overdue ? 'color:var(--red);font-weight:600' : '') + '">' +
          (t.overdue ? 'Atrasada · ' : t.dueDate === UI.todayIso() ? 'Hoje · ' : '') + UI.dateShort(t.dueDate) + '</span></div></div>' + UI.priorityBadge(t.priority) + '</div>';
      }).join('') + '</div>' : '<p class="muted" style="margin:8px 0 0;font-size:14px">' + UI.icon('check', 'sm') + ' Nada vencendo nos próximos 7 dias.</p>') + '</div>';
  }

  function stat(tone, ic, val, label, hint, target) {
    return '<button class="stat tone-' + tone + '" data-go="' + target + '"><span class="ic">' + UI.icon(ic) + '</span>' +
      '<span class="val num">' + val + '</span><span class="lbl">' + label + '</span>' +
      (hint ? '<span class="hint">' + UI.esc(hint) + '</span>' : '') + '</button>';
  }

  function trendCard(f, month) {
    var max = Math.max.apply(null, f.trend.map(function (t) { return Math.max(t.spent, t.budget || 0); }).concat([1]));
    return '<div class="card"><h3 class="card-t">Gastos no mercado<span class="muted" style="font-size:12.5px;font-weight:500">6 meses</span></h3>' +
      '<div class="bars">' + f.trend.map(function (t) {
        var h = Math.max(t.spent / max * 100, t.spent > 0 ? 4 : 2);
        var tick = t.budget ? '<span class="tick" style="bottom:' + (t.budget / max * 100) + '%"></span>' : '';
        return '<div class="bar' + (t.month === month ? ' cur' : '') + '" title="' + UI.esc(UI.monthLabel(t.month, true)) + '">' +
          '<div class="col' + (t.budget && t.spent > t.budget ? ' over' : '') + '" style="height:0" data-h="' + h + '%">' + tick + '</div>' +
          '<small>' + UI.monthLabel(t.month) + '</small></div>';
      }).join('') + '</div>' +
      '<div class="legend"><span><i style="background:var(--green)"></i>Gasto</span><span><i style="background:var(--yellow)"></i>Orçamento</span></div></div>';
  }

  function activityCard(items) {
    if (!items || !items.length) return '';
    return '<div class="section"><div class="section-head"><h3>Atividade recente</h3>' +
      '<button class="link-btn" data-go="history">Ver tudo ' + UI.icon('chevron-right', 'sm') + '</button></div>' +
      '<div class="list">' + items.map(Settings.logRow).join('') + '</div></div>';
  }

  function render(el) {
    var me = App.me();
    App.setHeader('Início', App.state.session.household.name);
    el.innerHTML = UI.skeleton([210, 60, 130, 120]);
    App.api('dashboard.summary', { month: mesSel || '' }).then(function (d) {
      if (App.state.view !== 'home') return;
      var h = d.home;
      var html = d.finance ? heroFinance(d.finance, d) : heroMember(h);
      html += '<div class="greet" style="padding:18px 2px 12px"><h2>' + greeting() + ', ' + UI.esc(me.name.split(' ')[0]) + '</h2><p class="data-hoje">' + dataLonga() + '</p></div>';
      html += onboarding(d);
      html += upcomingCard(h);

      var noProducts = h.productsTotal === 0;
      var stats = [];
      if (moduloAtivo('mercado')) {
        stats.push(stat('red', 'package-x', h.restock.count, 'Precisam de reposição', noProducts ? 'Nenhum produto cadastrado' : (h.restock.names.join(', ') || 'Tudo abastecido'), 'market:OUT'));
        stats.push(stat('yellow', 'package-minus', h.low.count, 'Com estoque baixo', noProducts ? 'Cadastre no Mercado' : (h.low.names.join(', ') || 'Nenhum alerta'), 'market:LOW'));
      }
      if (moduloAtivo('compras')) stats.push(stat('blue', 'shopping-bag', h.generalPending.count, 'Compras gerais pendentes',
        (h.generalPending.count ? (h.generalPending.high ? h.generalPending.high + ' com prioridade alta' : 'Estimado ' + UI.money(h.generalPending.estimated)) : 'Nenhuma pendência') +
        (moduloAtivo('desejos') && h.wishes ? ' · ' + h.wishes + ' desejo(s)' : ''), 'shopping'));
      if (moduloAtivo('casa')) stats.push(stat('green', 'list-checks', h.tasks.open, 'Afazeres em aberto', h.tasks.overdue ? h.tasks.overdue + ' atrasado(s)' : (h.tasks.open ? 'Nenhum atrasado' : 'Casa em dia'), 'house'));
      html += '<div class="section"><div class="section-head"><h3>Resumo da casa</h3></div><div class="stats">' + stats.join('') + '</div></div>';

      if (d.finance && d.finance.hasAnyData) html += '<div class="section">' + trendCard(d.finance, d.month) + '</div>';
      html += activityCard(d.activity);
      el.innerHTML = html;

      // eventos
      el.querySelectorAll('[data-go]').forEach(function (b) {
        b.onclick = function () {
          var p = b.dataset.go.split(':');
          App.go(p[0], p[1] ? { filter: p[1] } : {}, p[0] === 'history' ? { push: true } : null);
        };
      });
      var ant = el.querySelector('#mesAnt'), prox = el.querySelector('#mesProx'), rot = el.querySelector('#mesRotulo');
      if (ant) ant.onclick = function () { mesSel = shiftMonth(d.month, -1); render(el); };
      if (prox) prox.onclick = function () { mesSel = shiftMonth(d.month, 1); if (mesSel >= d.currentMonth) mesSel = null; render(el); };
      if (rot) rot.onclick = function () { if (mesSel) { mesSel = null; render(el); } };
      var oc = el.querySelector('#btnOcultar');
      if (oc) oc.onclick = function () {
        var novo = Ocultar.alternar();
        oc.innerHTML = UI.icon(novo ? 'eye-off' : 'eye', 'sm');
        oc.setAttribute('aria-pressed', novo);
      };
      var sb = el.querySelector('#setBudget');
      if (sb) sb.onclick = function () { Settings.budgetForm(null, App.reload); };
      var obf = el.querySelector('#obFechar');
      if (obf) obf.onclick = function () { Store.set('inicio-ok', true); App.reload(); };
      el.querySelectorAll('[data-ob]').forEach(function (b) {
        b.onclick = function () {
          var a = b.dataset.ob;
          if (a === 'budget') Settings.budgetForm(null, App.reload);
          else if (a === 'member') Family.memberForm(null, App.reload);
          else if (a === 'product') Market.productForm(null, App.reload);
          else if (a === 'task') House.form(null, App.reload);
        };
      });
      requestAnimationFrame(function () {
        el.querySelectorAll('[data-w]').forEach(function (m) { m.style.width = m.dataset.w; });
        el.querySelectorAll('[data-h]').forEach(function (c) { c.style.height = c.dataset.h; });
      });
    }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      el.innerHTML = UI.empty('cloud-off', 'Não foi possível carregar', e.message, '<button class="btn btn-soft btn-sm" onclick="App.reload()">Tentar novamente</button>');
    });
  }

  App.register('home', { title: 'Início', render: render });
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Market.html  (aba MERCADO)
 * Estoque (produtos, consumo, reposição, ajuste, histórico), categorias,
 * listas de compras (mensal/semanal/emergencial) e compras com nota fiscal.
 * ===================================================================== */
var Market = (function () {
  var data = null;
  var ui = { tab: Store.get('marketTab', 'stock'), filter: 'ALL', q: '' };
  var STATE = {
    OUT: { label: 'Esgotado', cls: 'b-red', color: 'var(--red)', bg: 'var(--red-soft)', icon: 'package-x' },
    LOW: { label: 'Baixo', cls: 'b-yellow', color: '#B9851F', bg: 'var(--yellow-soft)', icon: 'package-minus' },
    OK: { label: 'Em estoque', cls: 'b-green', color: 'var(--green)', bg: 'var(--green-tint)', icon: 'package' }
  };
  var LIST_TYPES = [
    { value: 'MONTHLY', label: 'Mensal', icon: 'calendar-days' },
    { value: 'WEEKLY', label: 'Semanal', icon: 'calendar-range' },
    { value: 'EMERGENCY', label: 'Emergencial', icon: 'siren' }
  ];
  var LIST_ICON = { MONTHLY: 'calendar-days', WEEKLY: 'calendar-range', EMERGENCY: 'siren' };
  var LIST_LABEL = { MONTHLY: 'Mensal', WEEKLY: 'Semanal', EMERGENCY: 'Emergencial' };
  var FREQ = { 7: 'Semanal', 14: 'Quinzenal', 30: 'Mensal' };
  var FREQ_OPTS = [{ value: '7', label: 'Semanal', icon: 'calendar-days' }, { value: '14', label: 'Quinzenal', icon: 'calendar-range' }, { value: '30', label: 'Mensal', icon: 'calendar' }];

  function linkBtn(url, cls) {
    return url ? '<a class="' + (cls || 'icon-btn plain') + '" href="' + UI.esc(url) + '" target="_blank" rel="noopener noreferrer" aria-label="Abrir link" title="Abrir link">' + UI.icon('external-link') + '</a>' : '';
  }
  function normLink(v) { v = String(v || '').trim(); return v && !/^https?:\/\//i.test(v) ? 'https://' + v : v; }

  function load() { return App.api('market.overview').then(function (d) { data = d; return d; }); }
  function ensure() { return data ? Promise.resolve(data) : load(); }
  function done(cb) { return function (r) { data = null; if (cb) cb(r); }; }

  // =================================================================
  // View principal
  // =================================================================
  function render(el, params) {
    if (params && params.filter) { ui.tab = 'stock'; ui.filter = params.filter; params.filter = null; }
    if (params && params.tab) { ui.tab = params.tab; params.tab = null; }
    if (ui.tab === 'purchases' && !App.can('purchases.view')) ui.tab = 'stock';
    el.innerHTML = UI.skeleton([44, 48, 72, 72, 72, 72]);
    load().then(function () { if (App.state.view === 'market') draw(el); }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      el.innerHTML = UI.empty('cloud-off', 'Não foi possível carregar', e.message, '<button class="btn btn-soft btn-sm" onclick="App.reload()">Tentar novamente</button>');
      UI.refreshIcons();
    });
  }

  function draw(el) {
    App.setHeader('Mercado', UI.monthLabel(data.month, true));
    App.setActions(App.can('products.manage') ? '<button class="icon-btn" id="catBtn" aria-label="Categorias">' + UI.icon('tags') + '</button>' : '');
    var cb = document.getElementById('catBtn');
    if (cb) cb.onclick = categoriesSheet;

    var tabs = [{ v: 'stock', l: 'Estoque' }, { v: 'lists', l: 'Listas' }];
    if (App.can('purchases.view')) tabs.push({ v: 'purchases', l: 'Compras' });
    el.innerHTML = '<div class="segmented">' + tabs.map(function (t) {
      return '<button data-tab-m="' + t.v + '" class="' + (ui.tab === t.v ? 'on' : '') + '">' + t.l + '</button>';
    }).join('') + '</div><div id="mBody"></div>';
    el.querySelectorAll('[data-tab-m]').forEach(function (b) {
      b.onclick = function () { ui.tab = b.dataset.tabM; Store.set('marketTab', ui.tab); draw(el); };
    });
    var body = document.getElementById('mBody');
    if (ui.tab === 'lists') drawLists(body);
    else if (ui.tab === 'purchases') drawPurchases(body);
    else drawStock(body);
    UI.refreshIcons();
  }

  // ---------------- Estoque ----------------
  function drawStock(body) {
    var p = data.products;
    if (App.can('products.manage')) App.fab({ label: 'Produto', icon: 'plus', onClick: function () { productForm(null, App.reload); } });
    else App.fab(null);
    if (!p.length) {
      body.innerHTML = '<div class="card">' + UI.empty('package-open', 'Nenhum produto cadastrado',
        App.can('products.manage') ? 'Cadastre os itens da sua despensa para acompanhar o estoque e gerar listas automaticamente.' : 'O administrador ainda não cadastrou produtos.',
        App.can('products.manage') ? '<button class="btn btn-primary btn-sm" id="firstProd">' + UI.icon('plus') + ' Cadastrar produto</button>' : '') + '</div>';
      var fp = document.getElementById('firstProd');
      if (fp) fp.onclick = function () { productForm(null, App.reload); };
      return;
    }
    var count = { OUT: 0, LOW: 0 };
    var cats = {};
    p.forEach(function (x) { if (count[x.state] !== undefined) count[x.state]++; cats[x.categoryId] = x.categoryName; });
    var chips = [{ v: 'ALL', l: 'Todos', n: p.length }, { v: 'OUT', l: 'Esgotados', n: count.OUT }, { v: 'LOW', l: 'Baixo', n: count.LOW }]
      .concat(Object.keys(cats).sort(function (a, b) { return cats[a].localeCompare(cats[b]); }).map(function (k) { return { v: 'C:' + k, l: cats[k] }; }));
    body.innerHTML = '<div class="search">' + UI.icon('search') + '<input id="mq" placeholder="Buscar produto" value="' + UI.esc(ui.q) + '"></div>' +
      '<div class="chips">' + chips.map(function (c) {
        return '<button class="chip' + (ui.filter === c.v ? ' on' : '') + '" data-f="' + UI.esc(c.v) + '">' + UI.esc(c.l) + (c.n !== undefined ? ' <span class="n">' + c.n + '</span>' : '') + '</button>';
      }).join('') + '</div><div id="pList"></div>';
    body.querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () { ui.filter = b.dataset.f; body.querySelectorAll('[data-f]').forEach(function (x) { x.classList.toggle('on', x === b); }); drawProducts(); };
    });
    document.getElementById('mq').oninput = function (e) { ui.q = e.target.value; drawProducts(); };
    drawProducts();
  }

  function filtered() {
    var q = ui.q.trim().toLowerCase();
    return data.products.filter(function (x) {
      if (ui.filter === 'OUT' || ui.filter === 'LOW') { if (x.state !== ui.filter) return false; }
      else if (ui.filter.indexOf('C:') === 0 && x.categoryId !== ui.filter.substring(2)) return false;
      return !q || x.name.toLowerCase().indexOf(q) !== -1;
    });
  }

  function productRow(x) {
    var st = STATE[x.state];
    var canOut = App.can('consumption.create'), canIn = App.can('inventory.update');
    return '<div class="row" data-pid="' + x.productId + '">' +
      '<span class="lead-ic" style="background:' + st.bg + ';color:' + st.color + '">' + UI.icon(st.icon) + '</span>' +
      '<button class="main" data-open style="text-align:left"><div class="t">' + UI.esc(x.name) + '</div>' +
      '<div class="s" style="white-space:normal;flex-wrap:wrap">' + UI.esc(x.categoryName) + (x.minStock ? ' · mín. ' + UI.qty(x.minStock) : '') +
      (x.state !== 'OK' ? ' · <span class="badge ' + st.cls + '" style="padding:1px 6px">' + st.label + '</span>' : '') + '</div></button>' +
      '<div class="stepper">' +
        (canOut ? '<button data-step="OUT" aria-label="Consumir">' + UI.icon('minus') + '</button>' : '') +
        '<div class="q num">' + UI.qty(x.quantity) + '<small>' + UI.esc(x.unit) + '</small></div>' +
        (canIn ? '<button data-step="IN" aria-label="Repor">' + UI.icon('plus') + '</button>' : '') +
      '</div></div>';
  }

  function drawProducts() {
    var box = document.getElementById('pList');
    if (!box) return;
    var list = filtered();
    box.innerHTML = list.length ? '<div class="list">' + list.map(productRow).join('') + '</div>' :
      '<div class="card">' + UI.empty('search-x', 'Nada por aqui', ui.filter === 'OUT' || ui.filter === 'LOW' ? 'Nenhum produto nesta situação. Ótimo sinal!' : 'Nenhum produto encontrado para a busca.') + '</div>';
    box.querySelectorAll('[data-pid]').forEach(function (row) {
      var prod = data.products.filter(function (x) { return x.productId === row.dataset.pid; })[0];
      row.querySelector('[data-open]').onclick = function () { productSheet(prod); };
      row.querySelectorAll('[data-step]').forEach(function (b) {
        b.onclick = function () { quickStep(prod, b.dataset.step, row); };
      });
    });
    UI.refreshIcons();
  }

  /** +1 / -1 direto na linha, com atualização otimista. */
  function quickStep(prod, type, row) {
    if (type === 'OUT' && prod.quantity <= 0) return UI.toast('Este produto já está esgotado.', 'error');
    if (row.dataset.busy) return;
    row.dataset.busy = '1';
    var before = prod.quantity;
    prod.quantity = Math.max(0, before + (type === 'IN' ? 1 : -1));
    row.querySelector('.q').innerHTML = UI.qty(prod.quantity) + '<small>' + UI.esc(prod.unit) + '</small>';
    App.api('market.stock.move', { productId: prod.productId, type: type, quantity: 1 }).then(function (r) {
      delete row.dataset.busy;
      prod.quantity = r.quantity;
      var changed = prod.state !== r.state;
      prod.state = r.state;
      UI.toast(type === 'IN' ? 'Reposição registrada: ' + prod.name : 'Consumo registrado: ' + prod.name);
      if (changed) drawProducts();
    }, function (e) {
      delete row.dataset.busy;
      prod.quantity = before;
      row.querySelector('.q').innerHTML = UI.qty(before) + '<small>' + UI.esc(prod.unit) + '</small>';
      UI.toast(e.message, 'error');
    });
  }

  // ---------------- Produto: detalhe ----------------
  function productSheet(prod) {
    var st = STATE[prod.state];
    var btns = [];
    if (App.can('consumption.create')) btns.push('<button class="btn btn-soft" data-mv="OUT">' + UI.icon('circle-minus') + ' Consumir</button>');
    if (App.can('inventory.update')) btns.push('<button class="btn btn-primary" data-mv="IN">' + UI.icon('circle-plus') + ' Repor</button>');
    var s = UI.sheet({
      title: prod.name,
      body: '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 16px">' +
          '<div><div class="muted" style="font-size:13px">Em estoque</div><div class="num" style="font-size:34px;font-weight:800;letter-spacing:-.03em">' + UI.qty(prod.quantity) + ' <span style="font-size:16px;color:var(--muted)">' + UI.esc(prod.unit) + '</span></div></div>' +
          '<span class="badge ' + st.cls + '">' + st.label + '</span></div>' +
        (btns.length ? '<div class="btn-row" style="margin-bottom:16px">' + btns.join('') + '</div>' : '') +
        '<div class="card" style="padding:4px 16px;box-shadow:none">' +
          '<div class="kv"><span>Categoria</span><strong>' + UI.esc(prod.categoryName) + '</strong></div>' +
          '<div class="kv"><span>Estoque mínimo</span><strong>' + (prod.minStock ? UI.qty(prod.minStock) + ' ' + UI.esc(prod.unit) : '—') + '</strong></div>' +
          '<div class="kv"><span>Estoque ideal</span><strong>' + (prod.idealStock ? UI.qty(prod.idealStock) + ' ' + UI.esc(prod.unit) : '—') + '</strong></div>' +
          (prod.notes ? '<div class="kv"><span>Observações</span><strong>' + UI.esc(prod.notes) + '</strong></div>' : '') +
          (prod.link ? '<div class="kv"><span>Link</span><strong><a href="' + UI.esc(prod.link) + '" target="_blank" rel="noopener noreferrer">Abrir produto ' + UI.icon('external-link', 'sm') + '</a></strong></div>' : '') +
        '</div>' +
        '<div class="section"><div class="section-head"><h3>Movimentações</h3></div><div id="mvList">' + UI.skeleton([56, 56]) + '</div></div>',
      foot: (App.can('inventory.update') ? '<button class="btn btn-ghost" data-mv="ADJUST">' + UI.icon('scale') + ' Ajustar</button>' : '') +
        (App.can('products.manage') ? '<button class="btn btn-ghost" id="editProd">' + UI.icon('pencil') + ' Editar</button>' : '') || null,
      onMount: function (el, close) {
        el.querySelectorAll('[data-mv]').forEach(function (b) {
          b.onclick = function () { close(); moveForm(prod, b.dataset.mv, App.reload); };
        });
        var ep = el.querySelector('#editProd');
        if (ep) ep.onclick = function () { close(); productForm(prod, App.reload); };
        App.api('market.product.history', { productId: prod.productId }).then(function (list) {
          var box = el.querySelector('#mvList');
          if (!box) return;
          box.innerHTML = list.length ? '<div class="list">' + list.map(function (m) {
            var tone = m.type === 'IN' ? 'b-green' : m.type === 'OUT' ? 'b-red' : 'b-gray';
            var sign = m.type === 'IN' ? '+' : m.type === 'OUT' ? '−' : (m.quantity >= 0 ? '+' : '−');
            return '<div class="row"><div class="main"><div class="t" style="font-weight:500">' + UI.esc(m.reason) + '</div>' +
              '<div class="s">' + UI.esc(m.memberName) + ' · ' + UI.relative(m.createdAt) + ' · saldo ' + UI.qty(m.balanceAfter) + '</div></div>' +
              '<span class="badge ' + tone + ' num">' + sign + UI.qty(Math.abs(m.quantity)) + '</span></div>';
          }).join('') + '</div>' : '<div class="muted" style="font-size:13.5px;padding:6px 2px">Nenhuma movimentação registrada.</div>';
        }, function (e) { var box = el.querySelector('#mvList'); if (box) box.innerHTML = '<div class="muted">' + UI.esc(e.message) + '</div>'; });
      }
    });
    return s;
  }

  // ---------------- Movimentar estoque ----------------
  function moveForm(prod, type, onDone) {
    var T = {
      OUT: { title: 'Registrar consumo', btn: 'Registrar consumo', help: 'Disponível: ' + UI.qty(prod.quantity) + ' ' + prod.unit, def: 1 },
      IN: { title: 'Repor estoque', btn: 'Adicionar ao estoque', help: 'Atual: ' + UI.qty(prod.quantity) + ' ' + prod.unit, def: 1 },
      ADJUST: { title: 'Ajustar contagem', btn: 'Salvar contagem', help: 'Informe a quantidade real contada agora.', def: prod.quantity }
    }[type];
    UI.sheet({
      title: T.title,
      body: '<div style="font-weight:700;font-size:16px;margin-bottom:12px">' + UI.esc(prod.name) + '</div>' +
        '<form id="mvForm">' +
        UI.field(type === 'ADJUST' ? 'Quantidade em estoque' : 'Quantidade',
          '<div style="display:flex;gap:8px;align-items:center"><button type="button" class="icon-btn" data-d="-1">' + UI.icon('minus') + '</button>' +
          '<input class="input num center" name="quantity" inputmode="decimal" value="' + UI.qty(T.def) + '" style="flex:1;font-size:20px;font-weight:700">' +
          '<button type="button" class="icon-btn" data-d="1">' + UI.icon('plus') + '</button>' +
          '<span class="muted" style="min-width:28px">' + UI.esc(prod.unit) + '</span></div>', T.help) +
        UI.field('Observação (opcional)', UI.input('reason', '', 'maxlength="120" placeholder="' + (type === 'OUT' ? 'ex.: café da manhã' : type === 'IN' ? 'ex.: compra na feira' : 'ex.: contagem mensal') + '"')) +
        '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="mvSave">' + T.btn + '</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#mvForm');
        var q = f.querySelector('[name=quantity]');
        el.querySelectorAll('[data-d]').forEach(function (b) {
          b.onclick = function () {
            var v = Number(String(q.value).replace(',', '.')) || 0;
            q.value = UI.qty(Math.max(0, v + Number(b.dataset.d)));
          };
        });
        function save() {
          var d = UI.formData(f);
          d.quantity = UI.parseMoney(d.quantity);
          if (!(d.quantity >= 0) || d.quantity === '') return UI.toast('Informe uma quantidade válida.', 'error');
          UI.run(el.querySelector('#mvSave'), function () {
            return App.api('market.stock.move', { productId: prod.productId, type: type, quantity: d.quantity, reason: d.reason });
          }, type === 'OUT' ? 'Consumo registrado' : type === 'IN' ? 'Estoque atualizado' : 'Contagem ajustada').then(function (r) { close(); done(onDone)(r); }, function () {});
        }
        el.querySelector('#mvSave').onclick = save;
        f.onsubmit = function (e) { e.preventDefault(); save(); };
      }
    });
  }

  /** Atalho "Registrar consumo": escolher o produto. */
  function consumePicker(onDone) {
    var s = UI.sheet({
      title: 'Registrar consumo',
      body: '<div class="search">' + UI.icon('search') + '<input id="cpq" placeholder="Buscar produto"></div><div id="cpList">' + UI.skeleton([56, 56, 56]) + '</div>',
      onMount: function (el, close) {
        ensure().then(function (d) {
          var box = el.querySelector('#cpList');
          function paint(q) {
            var list = d.products.filter(function (x) { return x.quantity > 0 && (!q || x.name.toLowerCase().indexOf(q) !== -1); });
            box.innerHTML = list.length ? '<div class="list">' + list.map(function (x) {
              return '<button class="row" data-id="' + x.productId + '"><span class="lead-ic">' + UI.icon('package') + '</span><span class="main"><span class="t">' + UI.esc(x.name) + '</span>' +
                '<span class="s">' + UI.qty(x.quantity) + ' ' + UI.esc(x.unit) + ' em estoque</span></span>' + UI.icon('chevron-right', 'sm muted') + '</button>';
            }).join('') + '</div>' : UI.empty('package-open', d.products.length ? 'Nenhum produto com estoque' : 'Nenhum produto cadastrado',
              d.products.length ? 'Os produtos esgotados não aparecem aqui.' : 'Cadastre produtos no módulo Mercado para registrar consumo.');
            box.querySelectorAll('[data-id]').forEach(function (b) {
              b.onclick = function () {
                var prod = d.products.filter(function (x) { return x.productId === b.dataset.id; })[0];
                close(); setTimeout(function () { moveForm(prod, 'OUT', onDone); }, 200);
              };
            });
            UI.refreshIcons();
          }
          el.querySelector('#cpq').oninput = function (e) { paint(e.target.value.trim().toLowerCase()); };
          paint('');
        }, function (e) { UI.toast(e.message, 'error'); close(); });
      }
    });
    return s;
  }

  // ---------------- Produto: formulário ----------------
  function productForm(prod, onDone) {
    var isNew = !prod, changed = false;
    prod = prod || { unit: 'un', minStock: '', idealStock: '' };
    ensure().then(function (d) {
      UI.sheet({
        title: isNew ? 'Novo produto' : 'Editar produto',
        body: '<form id="pForm">' +
          UI.field('Nome do produto', UI.input('name', prod.name, 'maxlength="60" placeholder="ex.: Arroz integral 1kg" required')) +
          '<div class="grid2">' + UI.field('Categoria', UI.select('categoryId', [{ value: '', label: 'Sem categoria' }].concat(d.categories.map(function (c) { return { value: c.categoryId, label: c.name }; })), prod.categoryId)) +
          UI.field('Unidade', UI.select('unit', d.units, prod.unit)) + '</div>' +
          '<div class="grid2">' + UI.field('Estoque mínimo', UI.input('minStock', prod.minStock || '', 'inputmode="decimal" placeholder="0"')) +
          UI.field('Estoque ideal', UI.input('idealStock', prod.idealStock || '', 'inputmode="decimal" placeholder="0"')) + '</div>' +
          (isNew ? UI.field('Quantidade atual', UI.input('quantity', '', 'inputmode="decimal" placeholder="0"'), 'Quanto você tem em casa agora.') : '') +
          UI.field('Observações', UI.input('notes', prod.notes, 'maxlength="200" placeholder="Marca preferida, onde guardar…"')) +
          UI.field('Link do produto', UI.input('link', prod.link, 'type="url" inputmode="url" placeholder="https:// (opcional)"'), 'Vai junto para as listas: quem for comprar abre exatamente este produto.') +
          '<div class="notice info">' + UI.icon('lightbulb', 'sm') + '<span>Com o estoque mínimo, o HomeFlow alerta quando o produto está acabando e o inclui nas listas automáticas.</span></div>' +
          '</form>',
        full: true,
        foot: (!isNew ? '<button class="btn btn-danger" id="pArchive" style="flex:0 0 auto">' + UI.icon('archive') + '</button>' : '') +
          '<button class="btn btn-ghost" data-close>Cancelar</button>' +
          (isNew ? '<button class="btn btn-ghost" id="pAgain">Salvar e cadastrar outro</button>' : '') +
          '<button class="btn btn-primary btn-full" id="pSave">' + (isNew ? 'Salvar produto' : 'Salvar alterações') + '</button>',
        onClose: function () { if (changed) done(onDone)(); },
        onMount: function (el, close) {
          var f = el.querySelector('#pForm');
          function save(again) {
            var v = UI.formData(f);
            ['minStock', 'idealStock', 'quantity'].forEach(function (k) { if (v[k] !== undefined) v[k] = UI.parseMoney(v[k]); });
            if (!v.name.trim()) return UI.toast('Informe o nome do produto.', 'error');
            v.link = normLink(v.link);
            if (!isNew) v.productId = prod.productId;
            UI.run(el.querySelector(again ? '#pAgain' : '#pSave'), function () { return App.api(isNew ? 'market.product.create' : 'market.product.update', v); },
              isNew ? 'Produto cadastrado: ' + v.name.trim() : 'Produto atualizado').then(function () {
              changed = true; data = null;
              if (!again) return close();
              ['name', 'quantity', 'notes', 'minStock', 'idealStock'].forEach(function (k) { if (f[k]) f[k].value = ''; });
              f.name.focus();
            }, function () {});
          }
          el.querySelector('#pSave').onclick = function () { save(false); };
          var ag = el.querySelector('#pAgain');
          if (ag) ag.onclick = function () { save(true); };
          f.onsubmit = function (e) { e.preventDefault(); save(false); };
          var ar = el.querySelector('#pArchive');
          if (ar) ar.onclick = function () {
            UI.confirm({ title: 'Arquivar produto?', message: '"' + prod.name + '" deixará de aparecer no estoque. O histórico é mantido.', ok: 'Arquivar', danger: true, icon: 'archive' }).then(function (ok) {
              if (!ok) return;
              App.api('market.product.archive', { productId: prod.productId }).then(function () { UI.toast('Produto arquivado'); changed = true; close(); }, function (e) { UI.toast(e.message, 'error'); });
            });
          };
          if (isNew && window.innerWidth > 700) f.querySelector('[name=name]').focus();
        }
      });
    }, function (e) { UI.toast(e.message, 'error'); });
  }

  // ---------------- Categorias ----------------
  function categoriesSheet() {
    UI.sheet({
      title: 'Categorias do mercado',
      body: '<form id="cForm" style="display:flex;gap:8px;margin-bottom:14px"><input class="input" name="name" placeholder="Nova categoria" maxlength="40"><button class="btn btn-primary" id="cAdd" style="flex:0 0 auto">' + UI.icon('plus') + '</button></form><div id="cList"></div>',
      onMount: function (el) {
        function paint() {
          var box = el.querySelector('#cList');
          var usage = {};
          data.products.forEach(function (p) { usage[p.categoryId] = (usage[p.categoryId] || 0) + 1; });
          box.innerHTML = data.categories.length ? '<div class="list">' + data.categories.map(function (c) {
            return '<div class="row"><span class="lead-ic">' + UI.icon('tag') + '</span><div class="main"><div class="t">' + UI.esc(c.name) + '</div><div class="s">' + (usage[c.categoryId] || 0) + ' produto(s)</div></div>' +
              '<button class="icon-btn plain" data-ren="' + c.categoryId + '" aria-label="Renomear">' + UI.icon('pencil') + '</button>' +
              '<button class="icon-btn plain" data-del="' + c.categoryId + '" aria-label="Excluir" style="color:var(--red)">' + UI.icon('trash-2') + '</button></div>';
          }).join('') + '</div>' : UI.empty('tags', 'Nenhuma categoria', 'Crie categorias para organizar seus produtos.');
          box.querySelectorAll('[data-ren]').forEach(function (b) {
            b.onclick = function () {
              var c = data.categories.filter(function (x) { return x.categoryId === b.dataset.ren; })[0];
              UI.sheet({
                title: 'Renomear categoria',
                body: '<form id="rnF">' + UI.field('Nome', UI.input('name', c.name, 'maxlength="40"')) + '</form>',
                foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="rnOk">Salvar</button>',
                onMount: function (rel, rclose) {
                  var rf = rel.querySelector('#rnF');
                  function ok() {
                    var name = rf.name.value.trim();
                    if (!name || name === c.name) return rclose();
                    UI.run(rel.querySelector('#rnOk'), function () { return App.api('market.category.update', { categoryId: c.categoryId, name: name }); }, 'Categoria renomeada')
                      .then(function () { c.name = name; rclose(); paint(); }, function () {});
                  }
                  rel.querySelector('#rnOk').onclick = ok;
                  rf.onsubmit = function (e) { e.preventDefault(); ok(); };
                }
              });
            };
          });
          box.querySelectorAll('[data-del]').forEach(function (b) {
            b.onclick = function () {
              var c = data.categories.filter(function (x) { return x.categoryId === b.dataset.del; })[0];
              UI.confirm({ title: 'Excluir categoria?', message: '"' + c.name + '" será removida.', ok: 'Excluir', danger: true, icon: 'trash-2' }).then(function (ok) {
                if (!ok) return;
                App.api('market.category.delete', { categoryId: c.categoryId }).then(function () {
                  data.categories = data.categories.filter(function (x) { return x !== c; }); UI.toast('Categoria excluída'); paint();
                }, function (e) { UI.toast(e.message, 'error'); });
              });
            };
          });
          UI.refreshIcons();
        }
        var f = el.querySelector('#cForm');
        f.onsubmit = function (e) {
          e.preventDefault();
          var name = f.name.value.trim();
          if (!name) return;
          UI.run(el.querySelector('#cAdd'), function () { return App.api('market.category.create', { name: name, scope: 'MARKET' }); }, 'Categoria criada').then(function (c) {
            data.categories.push(c); data.categories.sort(function (a, b) { return a.name.localeCompare(b.name); }); f.name.value = ''; paint();
          }, function () {});
        };
        paint();
      },
      onClose: function () { if (App.state.view === 'market') App.reload(); }
    });
  }

  // ---------------- Listas ----------------
  function drawLists(body) {
    if (App.can('lists.manage')) App.fab({ label: 'Nova lista', icon: 'list-plus', onClick: function () { listForm(App.reload); } });
    else App.fab(null);
    var open = data.lists.filter(function (l) { return l.status === 'OPEN'; });
    var closed = data.lists.filter(function (l) { return l.status !== 'OPEN'; });
    var recCard = recurringCard();
    if (!data.lists.length) {
      body.innerHTML = recCard + '<div class="card">' + UI.empty('clipboard-list', 'Nenhuma lista ainda',
        App.can('lists.manage') ? 'Crie listas mensais, semanais ou de reposição emergencial. O HomeFlow pode preencher com o que está acabando.' : 'Quando alguém criar uma lista de compras, ela aparecerá aqui.',
        App.can('lists.manage') ? '<button class="btn btn-primary btn-sm" id="firstList">' + UI.icon('list-plus') + ' Criar lista</button>' : '') + '</div>';
      var fl = document.getElementById('firstList');
      if (fl) fl.onclick = function () { listForm(App.reload); };
      bindRecurringCard(body);
      return;
    }
    function rows(list) {
      return '<div class="list">' + list.map(function (l) {
        var pct = l.total ? Math.round(l.checked / l.total * 100) : 0;
        return '<button class="row" data-lid="' + l.listId + '"><span class="lead-ic" style="' + (l.type === 'EMERGENCY' ? 'background:var(--red-soft);color:var(--red)' : '') + '">' + UI.icon(LIST_ICON[l.type]) + '</span>' +
          '<span class="main"><span class="t">' + UI.esc(l.name) + '</span><span class="s">' + LIST_LABEL[l.type] + ' · ' + l.checked + '/' + l.total + ' itens' +
          (l.status === 'OPEN' ? '' : ' · concluída ' + UI.dateShort(l.completedAt)) + '</span>' +
          (l.status === 'OPEN' && l.total ? '<span style="display:block;height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden"><i style="display:block;height:100%;width:' + pct + '%;background:var(--green);border-radius:4px"></i></span>' : '') +
          '</span>' + UI.icon('chevron-right', 'sm muted') + '</button>';
      }).join('') + '</div>';
    }
    body.innerHTML = recCard + (open.length ? '<div class="section-head"><h3>Em aberto</h3></div>' + rows(open) : '<div class="card">' + UI.empty('circle-check-big', 'Nenhuma lista em aberto', 'Todas as listas foram concluídas.') + '</div>') +
      (closed.length ? '<div class="section"><div class="section-head"><h3>Concluídas</h3></div>' + rows(closed.slice(0, 15)) + '</div>' : '');
    body.querySelectorAll('[data-lid]').forEach(function (b) {
      b.onclick = function () { App.go('list', { listId: b.dataset.lid }, { push: true }); };
    });
    bindRecurringCard(body);
  }

  // ---------------- Itens recorrentes ----------------
  function recurringCard() {
    if (!moduloAtivo('recorrentes')) return '';
    var rec = data.recurring || [];
    var ativos = rec.filter(function (r) { return r.active; });
    var due = ativos.filter(function (r) { return r.due; }).length;
    if (!rec.length && !App.can('lists.manage')) return '';
    return '<button class="card row" id="recCard" style="margin-bottom:14px;border-radius:var(--radius)">' +
      '<span class="lead-ic">' + UI.icon('repeat') + '</span><span class="main"><span class="t">Itens recorrentes</span>' +
      '<span class="s">' + (rec.length ? ativos.length + ' ativo(s)' + (due ? ' · ' + due + ' na hora de comprar' : ' · nenhum na hora') : 'Itens que voltam para a lista sozinhos') + '</span></span>' +
      (due ? '<span class="badge b-yellow">' + due + '</span>' : '') + UI.icon('chevron-right', 'sm muted') + '</button>';
  }

  function bindRecurringCard(body) {
    var c = body.querySelector('#recCard');
    if (c) c.onclick = recurringSheet;
  }

  function recurringSheet() {
    var s = UI.sheet({
      title: 'Itens recorrentes',
      body: '<p class="muted" style="margin:0 0 12px;font-size:13.5px">Entram sozinhos nas novas listas quando chega a hora (semanal, quinzenal ou mensal), sem duplicar.</p>' +
        '<div id="recList">' + UI.skeleton([56, 56]) + '</div>',
      foot: App.can('lists.manage') ? '<button class="btn btn-primary btn-full" id="recNew">' + UI.icon('plus') + ' Novo item recorrente</button>' : null,
      onClose: function () { if (App.state.view === 'market') App.reload(); },
      onMount: function (el, close) {
        var nb = el.querySelector('#recNew');
        if (nb) nb.onclick = function () { recurringForm(null, paint); };
        function paint() {
          load().then(function (d) {
            var box = el.querySelector('#recList');
            if (!box) return;
            box.innerHTML = d.recurring.length ? '<div class="list">' + d.recurring.map(function (r) {
              return '<div class="row" data-rid="' + r.recurringId + '"' + (r.active ? '' : ' style="opacity:.55"') + '>' +
                '<span class="lead-ic">' + UI.icon('repeat') + '</span>' +
                '<button class="main" data-open style="text-align:left"><div class="t">' + UI.esc(r.name) + '</div>' +
                '<div class="s">' + UI.qty(r.quantity) + ' ' + UI.esc(r.unit) + ' · ' + FREQ[r.everyDays] + ' · ' +
                (!r.active ? 'pausado' : r.due ? '<b style="color:#9A6C12">na hora</b>' : 'próxima ' + UI.dateShort(r.nextDate)) + '</div></button>' +
                linkBtn(r.link) + '</div>';
            }).join('') + '</div>' : UI.empty('repeat', 'Nenhum item recorrente', 'Ex.: papel higiênico todo mês, pão toda semana. Também dá para marcar "Repetir" ao adicionar um item na lista.');
            box.querySelectorAll('[data-rid]').forEach(function (row) {
              var r = d.recurring.filter(function (x) { return x.recurringId === row.dataset.rid; })[0];
              if (App.can('lists.manage')) row.querySelector('[data-open]').onclick = function () { recurringForm(r, paint); };
            });
          }, function (e) { UI.toast(e.message, 'error'); });
        }
        paint();
      }
    });
    return s;
  }

  function recurringForm(r, onDone) {
    var isNew = !r;
    r = r || { quantity: 1, everyDays: 30, active: true };
    ensure().then(function (d) {
      UI.sheet({
        title: isNew ? 'Novo item recorrente' : r.name,
        body: '<form id="rcF">' +
          (isNew ? UI.field('Item', UI.input('name', '', 'list="rcProd" maxlength="60" placeholder="Produto cadastrado ou item avulso" autocomplete="off"') +
            '<datalist id="rcProd">' + d.products.map(function (p) { return '<option value="' + UI.esc(p.name) + '">'; }).join('') + '</datalist>') : '') +
          UI.field('Quantidade a cada compra', UI.input('quantity', UI.qty(r.quantity), 'inputmode="decimal"')) +
          UI.field('Repetir', UI.options('everyDays', FREQ_OPTS, String(r.everyDays))) +
          UI.field('Link', UI.input('link', r.link, 'type="url" inputmode="url" placeholder="https:// (opcional)"')) +
          (!isNew ? UI.switchRow('active', 'Ativo', r.active, 'Pausado não entra nas novas listas') : '') + '</form>',
        foot: (!isNew ? '<button class="btn btn-danger" id="rcDel" style="flex:0 0 auto">' + UI.icon('trash-2') + '</button>' : '') +
          '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="rcOk">Salvar</button>',
        onMount: function (el, close) {
          var f = el.querySelector('#rcF');
          UI.bindOptions(f); UI.bindSwitches(f);
          function ok() {
            var v = UI.formData(f);
            var payload = { quantity: UI.parseMoney(v.quantity) || 1, everyDays: Number(v.everyDays), link: normLink(v.link) };
            if (isNew) {
              var name = String(v.name || '').trim();
              if (!name) return UI.toast('Informe o item.', 'error');
              var prod = d.products.filter(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })[0];
              if (prod) payload.productId = prod.productId; else payload.name = name;
            } else { payload.recurringId = r.recurringId; payload.active = !!v.active; }
            UI.run(el.querySelector('#rcOk'), function () { return App.api(isNew ? 'market.recurring.create' : 'market.recurring.update', payload); }, isNew ? 'Item recorrente criado' : 'Item recorrente salvo')
              .then(function () { close(); data = null; if (onDone) onDone(); }, function () {});
          }
          el.querySelector('#rcOk').onclick = ok;
          f.onsubmit = function (e) { e.preventDefault(); ok(); };
          var del = el.querySelector('#rcDel');
          if (del) del.onclick = function () {
            UI.confirm({ title: 'Excluir recorrente?', message: '"' + r.name + '" deixa de entrar nas listas. Itens já nas listas continuam.', ok: 'Excluir', danger: true, icon: 'trash-2' }).then(function (yes) {
              if (!yes) return;
              App.api('market.recurring.delete', { recurringId: r.recurringId }).then(function () { UI.toast('Recorrente excluído'); close(); data = null; if (onDone) onDone(); }, function (e) { UI.toast(e.message, 'error'); });
            });
          };
        }
      });
    }, function (e) { UI.toast(e.message, 'error'); });
  }

  function listForm(onDone) {
    UI.sheet({
      title: 'Nova lista de compras',
      body: '<form id="lForm">' + UI.field('Tipo', UI.options('type', LIST_TYPES, 'WEEKLY')) +
        UI.field('Nome (opcional)', UI.input('name', '', 'maxlength="60" placeholder="Gerado automaticamente se vazio"')) +
        UI.switchRow('fromStock', 'Incluir o que está acabando', true, 'Adiciona produtos esgotados ou abaixo do mínimo') +
        (moduloAtivo('recorrentes') ? UI.switchRow('withRecurring', 'Incluir itens recorrentes', true, 'Os que estão na hora de comprar') : '') + '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="lSave">Criar lista</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#lForm');
        UI.bindOptions(f); UI.bindSwitches(f);
        function save() {
          var v = UI.formData(f);
          if (v.withRecurring === undefined) v.withRecurring = false;
          UI.run(el.querySelector('#lSave'), function () { return App.api('market.list.create', v); }).then(function (r) {
            close(); data = null;
            UI.toast(r.added ? 'Lista criada com ' + r.added + ' item(ns)' : 'Lista criada');
            App.go('list', { listId: r.listId }, { push: true });
          }, function () {});
        }
        el.querySelector('#lSave').onclick = save;
        f.onsubmit = function (e) { e.preventDefault(); save(); };
      }
    });
  }

  // ---------------- Detalhe da lista (tela secundária) ----------------
  function renderList(el, params) {
    el.innerHTML = UI.skeleton([90, 52, 60, 60, 60]);
    Promise.all([App.api('market.list.detail', { listId: params.listId }), ensure()]).then(function (res) {
      if (App.state.view !== 'list') return;
      drawListDetail(el, res[0], res[1], params);
    }, function (e) {
      if (e.code === 'SESSION' || e.code === 'PROFILE') return;
      el.innerHTML = UI.empty('cloud-off', 'Não foi possível abrir a lista', e.message);
      UI.refreshIcons();
    });
  }

  function drawListDetail(el, d, md, params) {
    var L = d.list, items = d.items;
    var open = L.status === 'OPEN';
    var canManage = App.can('lists.manage') && open;
    var checked = items.filter(function (i) { return i.checked; }).length;
    App.setHeader(L.name, L.typeLabel + (open ? '' : ' · concluída'));
    App.setActions(App.can('lists.manage') ? '<button class="icon-btn" id="lMore" aria-label="Mais ações">' + UI.icon('ellipsis') + '</button>' : '');
    App.fab(null);

    el.innerHTML =
      '<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center">' +
        '<div><div class="muted" style="font-size:13px">Progresso</div><div style="font-size:22px;font-weight:800" class="num">' + checked + ' de ' + items.length + '</div></div>' +
        '<span class="badge ' + (open ? 'b-green' : 'b-gray') + '">' + (open ? 'Em aberto' : 'Concluída') + '</span></div>' +
        '<div style="height:8px;border-radius:8px;background:var(--line);margin-top:12px;overflow:hidden"><i style="display:block;height:100%;width:' + (items.length ? checked / items.length * 100 : 0) + '%;background:var(--green);border-radius:8px;transition:width .5s"></i></div></div>' +
      (canManage ? '<form id="addItem" style="display:flex;gap:8px;margin-bottom:12px">' +
        '<input class="input" name="name" list="prodList" placeholder="Adicionar item" maxlength="60" style="flex:1" autocomplete="off">' +
        '<input class="input num center" name="quantity" value="1" inputmode="decimal" style="width:58px">' +
        '<button type="button" class="btn btn-ghost" id="addMore" style="flex:0 0 auto;padding:0 12px" aria-label="Link e repetição" title="Link e repetição">' + UI.icon('sliders-horizontal') + '</button>' +
        '<button class="btn btn-primary" id="addBtn" style="flex:0 0 auto;padding:0 14px" aria-label="Adicionar">' + UI.icon('plus') + '</button>' +
        '<datalist id="prodList">' + md.products.map(function (p) { return '<option value="' + UI.esc(p.name) + '">'; }).join('') + '</datalist></form>' : '') +
      (canManage && d.recurringDue ? '<div class="notice" style="margin-bottom:12px;align-items:center">' + UI.icon('repeat', 'sm') +
        '<span style="flex:1">' + d.recurringDue + ' item(ns) recorrente(s) na hora de comprar.</span><button class="btn btn-sm" style="background:var(--white)" id="addRec">Incluir</button></div>' : '') +
      (items.length ? '<div class="list" id="items">' + items.map(function (i) {
        return '<div class="row' + (i.checked ? ' done' : '') + '" data-iid="' + i.itemId + '">' +
          '<button class="check' + (i.checked ? ' on' : '') + '" data-tg ' + (canManage ? '' : 'disabled') + '>' + UI.icon('check') + '</button>' +
          '<button class="main" data-item style="text-align:left"><div class="t">' + UI.esc(i.name) + '</div><div class="s">' + UI.qty(i.quantity) + ' ' + UI.esc(i.unit || 'un') +
          (i.recurringId ? ' · ' + UI.icon('repeat', 'sm') + 'recorrente' : '') +
          (i.checked && i.checkedBy ? ' · por ' + UI.esc(i.checkedBy) : '') + (i.productId ? '' : ' · avulso') + '</div></button>' +
          linkBtn(i.link, 'btn btn-soft btn-sm') + '</div>';
      }).join('') + '</div>' :
        '<div class="card">' + UI.empty('shopping-basket', 'Lista vazia', canManage ? 'Adicione itens acima — escolha um produto cadastrado ou digite um item avulso.' : 'Ainda não há itens nesta lista.') + '</div>') +
      '<div class="spacer"></div>' +
      (open && App.can('lists.manage') ? '<button class="btn btn-dark btn-block mt" id="completeBtn">' + UI.icon('circle-check-big') + ' Concluir lista</button>' : '') +
      (App.can('purchases.create') ? '<button class="btn btn-ghost btn-block mt" id="purchaseBtn">' + UI.icon('receipt') + ' Registrar compra desta lista</button>' : '');

    var reload = function () { renderList(el, params); };

    var addForm = el.querySelector('#addItem');
    if (addForm) addForm.onsubmit = function (e) {
      e.preventDefault();
      var name = addForm.name.value.trim();
      if (!name) return;
      var prod = md.products.filter(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })[0];
      var payload = { listId: L.listId, quantity: UI.parseMoney(addForm.quantity.value) || 1 };
      if (prod) payload.productId = prod.productId; else payload.name = name;
      UI.run(el.querySelector('#addBtn'), function () { return App.api('market.list.addItem', payload); }, 'Item adicionado').then(reload, function () {});
    };
    var am = el.querySelector('#addMore');
    if (am) am.onclick = function () { itemForm(L, md, addForm.name.value.trim(), UI.parseMoney(addForm.quantity.value) || 1, reload); };
    var ar = el.querySelector('#addRec');
    if (ar) ar.onclick = function () {
      UI.run(ar, function () { return App.api('market.list.addRecurring', { listId: L.listId }); }).then(function (r) {
        UI.toast(r.added + ' item(ns) recorrente(s) incluído(s)'); data = null; reload();
      }, function () {});
    };

    el.querySelectorAll('[data-iid]').forEach(function (row) {
      var item = items.filter(function (i) { return i.itemId === row.dataset.iid; })[0];
      var tg = row.querySelector('[data-tg]');
      if (canManage) tg.onclick = function () {
        item.checked = !item.checked;
        tg.classList.toggle('on', item.checked); row.classList.toggle('done', item.checked);
        App.api('market.list.toggleItem', { itemId: item.itemId, checked: item.checked }).then(function () {
          if (navigator.vibrate) { try { navigator.vibrate(10); } catch (x) {} }
          data = null;
          var c = items.filter(function (i) { return i.checked; }).length;
          var num = el.querySelector('.card .num'); if (num) num.textContent = c + ' de ' + items.length;
          var bar = el.querySelector('.card i'); if (bar) bar.style.width = (c / items.length * 100) + '%';
        }, function (e) {
          item.checked = !item.checked; tg.classList.toggle('on', item.checked); row.classList.toggle('done', item.checked);
          UI.toast(e.message, 'error');
        });
      };
      row.querySelector('[data-item]').onclick = function () { itemSheet(item, canManage, reload); };
    });

    var cb = el.querySelector('#completeBtn');
    if (cb) cb.onclick = function () {
      var canStock = App.can('inventory.update');
      UI.sheet({
        title: 'Concluir lista',
        body: '<p class="muted" style="margin-top:0">' + checked + ' de ' + items.length + ' itens marcados como comprados.</p>' +
          '<form id="cf">' + (canStock ? UI.switchRow('addToStock', 'Lançar itens comprados no estoque', true, 'Itens marcados com produto cadastrado entram como reposição') : '') + '</form>',
        foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="cfOk">Concluir</button>',
        onMount: function (sel, close) {
          var f = sel.querySelector('#cf');
          UI.bindSwitches(f);
          sel.querySelector('#cfOk').onclick = function () {
            var v = UI.formData(f);
            UI.run(sel.querySelector('#cfOk'), function () { return App.api('market.list.complete', { listId: L.listId, addToStock: !!v.addToStock }); }).then(function (r) {
              close(); data = null;
              UI.toast(r.stocked ? 'Lista concluída · ' + r.stocked + ' produto(s) repostos' : 'Lista concluída');
              reload();
            }, function () {});
          };
        }
      });
    };

    var pb = el.querySelector('#purchaseBtn');
    if (pb) pb.onclick = function () { purchaseForm({ listId: L.listId }, reload); };

    var more = document.getElementById('lMore');
    if (more) more.onclick = function () {
      var acts = [];
      if (open && moduloAtivo('recorrentes')) acts.push({ icon: 'repeat', label: 'Incluir itens recorrentes', hint: 'Os que estão na hora', onClick: function () {
        App.api('market.list.addRecurring', { listId: L.listId }).then(function (r) {
          UI.toast(r.added ? r.added + ' item(ns) recorrente(s) incluído(s)' : 'Nenhum recorrente na hora de comprar', r.added ? 'success' : 'info'); data = null; reload();
        }, function (e) { UI.toast(e.message, 'error'); });
      } });
      if (open && moduloAtivo('recorrentes')) acts.push({ icon: 'settings-2', label: 'Gerenciar recorrentes', onClick: recurringSheet });
      if (!open) acts.push({ icon: 'rotate-ccw', label: 'Reabrir lista', onClick: function () {
        App.api('market.list.reopen', { listId: L.listId }).then(function () { UI.toast('Lista reaberta'); data = null; reload(); }, function (e) { UI.toast(e.message, 'error'); });
      } });
      acts.push({ icon: 'trash-2', label: 'Excluir lista', tone: 'red', onClick: function () {
        UI.confirm({ title: 'Excluir lista?', message: 'A lista "' + L.name + '" e seus itens serão removidos.', ok: 'Excluir', danger: true, icon: 'trash-2' }).then(function (ok) {
          if (!ok) return;
          App.api('market.list.delete', { listId: L.listId }).then(function () { UI.toast('Lista excluída'); data = null; App.back(); }, function (e) { UI.toast(e.message, 'error'); });
        });
      } });
      UI.actions('Lista', acts);
    };
    UI.refreshIcons();
  }

  /** Adicionar item com link e repetição. */
  function itemForm(L, md, name, qtd, onDone) {
    UI.sheet({
      title: 'Adicionar item',
      full: true,
      body: '<form id="itF">' +
        UI.field('Item', UI.input('name', name, 'list="itProd" maxlength="60" placeholder="Produto cadastrado ou item avulso" autocomplete="off"') +
          '<datalist id="itProd">' + md.products.map(function (p) { return '<option value="' + UI.esc(p.name) + '">'; }).join('') + '</datalist>') +
        UI.field('Quantidade', UI.input('quantity', UI.qty(qtd || 1), 'inputmode="decimal"')) +
        UI.field('Link do produto', UI.input('link', '', 'type="url" inputmode="url" placeholder="https:// — quem for comprar abre este link"'),
          'Se o produto já tem link no cadastro, ele é usado automaticamente.') +
        (moduloAtivo('recorrentes') ? UI.field('Repetir', UI.options('everyDays', [{ value: '0', label: 'Não', icon: 'x' }].concat(FREQ_OPTS), '0').replace('class="opt-grid"', 'class="opt-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))"'),
          'Recorrente: volta sozinho nas próximas listas.') : '') + '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="itOk">Adicionar</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#itF');
        UI.bindOptions(f);
        if (!name) setTimeout(function () { f.name.focus(); }, 350);
        function ok() {
          var v = UI.formData(f);
          var nm = String(v.name || '').trim();
          if (!nm) return UI.toast('Informe o item.', 'error');
          var prod = md.products.filter(function (p) { return p.name.toLowerCase() === nm.toLowerCase(); })[0];
          var payload = { listId: L.listId, quantity: UI.parseMoney(v.quantity) || 1, link: normLink(v.link), everyDays: Number(v.everyDays || 0) };
          if (prod) payload.productId = prod.productId; else payload.name = nm;
          UI.run(el.querySelector('#itOk'), function () { return App.api('market.list.addItem', payload); }, payload.everyDays ? 'Item adicionado e marcado como recorrente' : 'Item adicionado')
            .then(function () { close(); data = null; onDone(); }, function () {});
        }
        el.querySelector('#itOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
      }
    });
  }

  /** Detalhe do item da lista: abrir link, alterar quantidade/link, remover. */
  function itemSheet(item, canManage, onDone) {
    UI.sheet({
      title: item.name,
      body: (item.link ? '<a class="btn btn-primary btn-block" style="margin-bottom:14px" href="' + UI.esc(item.link) + '" target="_blank" rel="noopener noreferrer">' + UI.icon('external-link') + ' Abrir o produto no link</a>' : '') +
        (item.recurringId ? '<div class="notice info" style="margin-bottom:14px">' + UI.icon('repeat', 'sm') + '<span>Item recorrente: volta sozinho nas próximas listas.</span></div>' : '') +
        (canManage ? '<form id="isF">' + '<div class="grid2">' + UI.field('Quantidade', UI.input('quantity', UI.qty(item.quantity), 'inputmode="decimal"')) +
          UI.field('Unidade', '<input class="input" value="' + UI.esc(item.unit || 'un') + '" disabled>') + '</div>' +
          UI.field('Link do produto', UI.input('link', item.link, 'type="url" inputmode="url" placeholder="https://"')) + '</form>' :
          (!item.link ? '<p class="muted" style="margin-top:0">' + UI.qty(item.quantity) + ' ' + UI.esc(item.unit || 'un') + ' · sem link</p>' : '')),
      foot: canManage ? '<button class="btn btn-danger" id="isDel" style="flex:0 0 auto">' + UI.icon('trash-2') + '</button>' +
        '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="isOk">Salvar</button>' : null,
      onMount: function (el, close) {
        var f = el.querySelector('#isF');
        if (!f) return;
        function ok() {
          var v = UI.formData(f);
          UI.run(el.querySelector('#isOk'), function () {
            return App.api('market.list.updateItem', { itemId: item.itemId, quantity: UI.parseMoney(v.quantity) || item.quantity, link: normLink(v.link) });
          }, 'Item atualizado').then(function () { close(); onDone(); }, function () {});
        }
        el.querySelector('#isOk').onclick = ok;
        f.onsubmit = function (e) { e.preventDefault(); ok(); };
        el.querySelector('#isDel').onclick = function () {
          App.api('market.list.removeItem', { itemId: item.itemId }).then(function () { UI.toast('Item removido'); close(); onDone(); }, function (e) { UI.toast(e.message, 'error'); });
        };
      }
    });
  }

  // ---------------- Compras do mês ----------------
  function drawPurchases(body) {
    if (App.can('purchases.create')) App.fab({ label: 'Registrar compra', icon: 'receipt', onClick: function () { purchaseForm({}, App.reload); } });
    else App.fab(null);
    var list = data.purchases;
    var total = list.reduce(function (a, p) { return a + p.total; }, 0);
    body.innerHTML = '<div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:14px">' +
        '<span class="lead-ic" style="width:46px;height:46px;border-radius:14px;background:var(--green-tint);color:var(--green);display:grid;place-items:center">' + UI.icon('wallet') + '</span>' +
        '<div style="flex:1"><div class="muted" style="font-size:13px">Total em ' + UI.esc(UI.monthLabel(data.month, true)) + '</div><div class="num" style="font-size:24px;font-weight:800">' + UI.money(total) + '</div></div>' +
        '<span class="badge b-gray">' + list.length + ' compra(s)</span></div>' +
      (list.length ? '<div class="list">' + list.map(function (p) {
        return '<button class="row" data-pur="' + p.purchaseId + '"><span class="lead-ic">' + UI.icon(p.receiptId ? 'file-image' : 'store') + '</span>' +
          '<span class="main"><span class="t">' + UI.esc(p.store) + '</span><span class="s">' + UI.dateShort(p.date) + ' · ' + UI.esc(p.memberName) + (p.receiptId ? ' · com nota' : '') + '</span></span>' +
          '<span class="end num" style="font-weight:700">' + UI.money(p.total) + '</span></button>';
      }).join('') + '</div>' :
        '<div class="card">' + UI.empty('receipt', 'Nenhuma compra neste mês', 'Registre as compras de mercado (com foto da nota, se quiser) para acompanhar o orçamento.',
          App.can('purchases.create') ? '<button class="btn btn-primary btn-sm" id="firstPur">' + UI.icon('camera') + ' Registrar compra</button>' : '') + '</div>');
    var fp = document.getElementById('firstPur');
    if (fp) fp.onclick = function () { purchaseForm({}, App.reload); };
    body.querySelectorAll('[data-pur]').forEach(function (b) {
      b.onclick = function () {
        var p = list.filter(function (x) { return x.purchaseId === b.dataset.pur; })[0];
        var acts = [];
        if (p.receiptId) acts.push({ icon: 'file-image', label: 'Ver nota fiscal', onClick: function () { viewReceipt(p.receiptId); } });
        acts.push({ icon: 'trash-2', label: 'Excluir compra', tone: 'red', hint: UI.money(p.total) + ' · ' + UI.dateShort(p.date), onClick: function () {
          UI.confirm({ title: 'Excluir compra?', message: p.store + ' · ' + UI.money(p.total) + '. O valor deixará de contar no orçamento.', ok: 'Excluir', danger: true, icon: 'trash-2' }).then(function (ok) {
            if (!ok) return;
            App.api('market.purchase.delete', { purchaseId: p.purchaseId }).then(function () { UI.toast('Compra excluída'); App.reload(); }, function (e) { UI.toast(e.message, 'error'); });
          });
        } });
        UI.actions(p.store, acts);
      };
    });
  }

  function viewReceipt(receiptId) {
    var s = UI.sheet({ title: 'Nota fiscal', body: '<div class="receipt-view" id="rv">' + UI.skeleton([320]) + '</div>' });
    App.api('market.receipt.view', { receiptId: receiptId }).then(function (r) {
      var box = s.el.querySelector('#rv');
      if (!box) return;
      box.innerHTML = /^image\//.test(r.mimeType) ? '<img src="' + r.dataUrl + '" alt="Nota fiscal">' :
        '<div class="center">' + UI.empty('file-text', r.fileName, 'Documento PDF', '<a class="btn btn-primary btn-sm" download="' + UI.esc(r.fileName) + '" href="' + r.dataUrl + '">' + UI.icon('download') + ' Baixar PDF</a>') + '</div>';
      UI.refreshIcons();
    }, function (e) { UI.toast(e.message, 'error'); s.close(); });
  }

  /** Registrar compra de mercado — opts: { camera, listId } */
  function purchaseForm(opts, onDone) {
    opts = opts || {};
    var receipt = null;
    var canPhoto = App.can('receipts.upload');
    UI.sheet({
      title: opts.camera ? 'Nota fiscal' : 'Registrar compra',
      full: true,
      body: '<form id="purForm">' +
        UI.field('Valor total (R$)', UI.moneyInput('total', '', 'class="input num valor-grande"')) +
        UI.field('Estabelecimento', UI.input('store', '', 'maxlength="60" placeholder="ex.: Supermercado Central"')) +
        UI.field('Data', UI.dateField('date')) +
        (canPhoto ? UI.field('Nota fiscal', '<label class="photo-drop" id="drop" style="cursor:pointer">' + UI.icon('camera', 'ico-lg') +
          '<span style="font-weight:600;color:var(--text)">Fotografar ou anexar</span><span style="font-size:12.5px">JPG, PNG ou PDF · opcional</span>' +
          '<input type="file" id="fileIn" accept="image/*,application/pdf" ' + (opts.camera ? 'capture="environment"' : '') + ' class="hidden"></label>') : '') +
        UI.field('Lista vinculada', '<select class="input" name="listId" id="purList"><option value="">Nenhuma</option></select>') +
        UI.field('Observações', UI.input('notes', '', 'maxlength="200" placeholder="opcional"')) + '</form>',
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="purSave">Salvar compra</button>',
      onMount: function (el, close) {
        var f = el.querySelector('#purForm');
        UI.bindDateFields(f);
        var fileIn = el.querySelector('#fileIn');
        if (fileIn) {
          fileIn.onchange = function () {
            var file = fileIn.files[0];
            if (!file) return;
            var drop = el.querySelector('#drop');
            drop.innerHTML = '<span class="spinner"></span><span>Preparando arquivo…</span>';
            UI.readImage(file).then(function (r) {
              receipt = r;
              drop.classList.add('has');
              drop.innerHTML = (r.preview ? '<img src="' + r.preview + '" alt="">' : UI.icon('file-text', 'ico-lg') + '<span>' + UI.esc(r.name) + '</span>') +
                '<span style="font-size:12.5px">Toque para trocar</span>';
              drop.appendChild(fileIn);
              UI.refreshIcons();
            }, function (e) { UI.toast(e.message, 'error'); });
          };
          if (opts.camera) { try { fileIn.click(); } catch (e) {} }
        }
        ensure().then(function (d) {
          var sel = el.querySelector('#purList');
          if (!sel) return;
          d.lists.filter(function (l) { return l.status === 'OPEN' || l.listId === opts.listId; }).forEach(function (l) {
            var o = document.createElement('option'); o.value = l.listId; o.textContent = l.name;
            if (l.listId === opts.listId) o.selected = true;
            sel.appendChild(o);
          });
        }, function () {});
        function save() {
          var v = UI.formData(f);
          var total = UI.parseMoney(v.total);
          if (!v.store.trim()) return UI.toast('Informe o estabelecimento.', 'error');
          if (!(total > 0)) return UI.toast('Informe um valor total válido.', 'error');
          var payload = { store: v.store, total: total, date: v.date, listId: v.listId, notes: v.notes };
          if (receipt) payload.receipt = { base64: receipt.base64, mimeType: receipt.mimeType };
          UI.run(el.querySelector('#purSave'), function () { return App.api('market.purchase.create', payload); }, 'Compra registrada').then(function (r) { close(); done(onDone)(r); }, function () {});
        }
        el.querySelector('#purSave').onclick = save;
        f.onsubmit = function (e) { e.preventDefault(); save(); };
      }
    });
  }

  App.register('market', { title: 'Mercado', render: render, perm: 'products.view' });
  App.register('list', { title: 'Lista', tab: 'market', render: renderList, perm: 'lists.view' });

  return { productForm: productForm, consumePicker: consumePicker, listForm: listForm, purchaseForm: purchaseForm, invalidate: function () { data = null; } };
})();
</script>
<script>
/* =====================================================================
 * HomeFlow — Shopping.html  (aba COMPRAS)
